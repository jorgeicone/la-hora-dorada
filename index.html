  --alarm:#FF4438; --amber:#FFC24A;
  --panel:rgba(2,26,21,.74); --line:rgba(5,221,77,.42);
  --disp:'Orbitron',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--mint);
  font-family:var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Lienzo 16:9 fijo ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;
  transform-origin:center center;background:var(--abyss);
  box-shadow:0 0 90px rgba(5,221,77,.13)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- Capas de fondo ---------- */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.scrim{position:absolute;inset:0;
  background:radial-gradient(70% 60% at 50% 50%,rgba(1,15,12,.35),rgba(1,15,12,.88) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.layer{position:relative;z-index:3;flex:1;display:flex;flex-direction:column}

/* ---------- Tipografía ---------- */
.disp{font-family:var(--disp);letter-spacing:.08em}
h1{font-family:var(--disp);font-size:52px;font-weight:900;letter-spacing:.03em;line-height:1.05}
h2{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.06em}
.kicker{font-family:var(--disp);font-size:15px;font-weight:500;letter-spacing:.34em;
  color:var(--green);text-shadow:0 0 18px rgba(5,221,77,.7)}

/* ---------- Botones ---------- */
.btn{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:15px 34px;border-radius:999px;
  border:1px solid var(--line);background:rgba(2,26,21,.8);color:var(--green);
  transition:.16s;display:inline-flex;align-items:center;gap:12px}
.btn:hover{background:var(--green);color:var(--abyss);box-shadow:0 0 30px rgba(5,221,77,.6)}
.btn.solid{background:var(--green);color:var(--abyss);border-color:var(--green)}
.btn.solid:hover{background:var(--green-soft);box-shadow:0 0 40px rgba(5,221,77,.8)}
.btn.ghost{color:var(--mint);border-color:rgba(219,255,240,.4)}
.btn.ghost:hover{background:rgba(219,255,240,.14);color:var(--mint);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(2,26,21,.8);color:var(--green);
  font-size:18px;transition:.16s}
.ico:hover{background:var(--green);color:var(--abyss)}

/* ---------- Barra superior ---------- */
.top{position:absolute;top:20px;left:20px;right:20px;z-index:8;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.tl,.tr{display:flex;gap:10px;align-items:center}
.timer{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.1em;
  color:var(--green);border:1px solid var(--line);background:rgba(2,26,21,.85);
  padding:10px 22px;border-radius:999px;min-width:120px;text-align:center}
.timer.warn{color:var(--amber);border-color:var(--amber)}
.timer.crit{color:var(--alarm);border-color:var(--alarm);animation:pulse .55s infinite}
@keyframes pulse{50%{opacity:.4}}
.score{font-family:var(--disp);font-size:14px;font-weight:500;letter-spacing:.12em;
  color:var(--mint);border:1px solid rgba(219,255,240,.28);background:rgba(2,26,21,.7);
  padding:11px 18px;border-radius:999px}

/* ---------- Contador de signos vitales ---------- */
.vitals{position:absolute;right:20px;top:96px;z-index:8;
  display:flex;flex-direction:column;gap:10px}
.vital{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;
  border:1px solid rgba(219,255,240,.22);background:rgba(2,26,21,.7);transition:.3s}
.vital svg{width:36px;height:22px}
.vital polyline{fill:none;stroke:rgba(219,255,240,.28);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.vital.got{border-color:var(--green);box-shadow:0 0 26px rgba(5,221,77,.55)}
.vital.got polyline{stroke:var(--green);filter:drop-shadow(0 0 5px var(--green));
  animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.65}50%{opacity:1}}

/* ---------- Portada ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.titlebox{background:var(--panel);border:1px solid var(--line);padding:32px 74px;
  text-align:center;backdrop-filter:blur(3px);border-radius:6px;
  box-shadow:0 0 60px rgba(5,221,77,.16),inset 0 0 40px rgba(0,0,0,.35)}

/* ---------- Paneles de texto ---------- */
.wrap{flex:1;display:grid;place-items:center;padding:92px 110px 34px}
.panel{width:100%;max-width:900px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:34px 40px;backdrop-filter:blur(3px);
  box-shadow:0 0 50px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.25)}
.narr{font-size:19px;line-height:1.6;text-align:center;color:var(--mint)}
.floatbtn{position:absolute;bottom:34px;right:34px;z-index:8}

/* ---------- Mapa ---------- */
.node{position:absolute;width:150px;transform:translate(-50%,-50%);z-index:6;
  text-align:center;transition:.2s}
.node .ring{width:66px;height:66px;margin:0 auto;border-radius:50%;
  border:2px solid rgba(219,255,240,.25);display:grid;place-items:center;
  font-family:var(--disp);font-size:20px;font-weight:700;color:rgba(219,255,240,.35);
  background:rgba(2,26,21,.55);transition:.25s}
.node .lbl{margin-top:8px;font-family:var(--disp);font-size:11px;letter-spacing:.12em;
  color:rgba(219,255,240,.45);text-transform:uppercase}
.node.locked{filter:grayscale(.7)}
.node.done .ring{border-color:var(--green);color:var(--green);
  box-shadow:0 0 30px rgba(5,221,77,.6)}
.node.done .lbl{color:var(--green)}
.node.avail{cursor:pointer}
.node.avail .ring{border-color:var(--green-soft);color:var(--green-soft);
  animation:halo 1.7s ease-in-out infinite}
.node.avail .lbl{color:var(--mint)}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.08)}
@keyframes halo{
  0%,100%{box-shadow:0 0 18px rgba(5,221,77,.45)}
  50%{box-shadow:0 0 46px rgba(5,221,77,.95),0 0 90px rgba(5,221,77,.35)}}
.node .card{position:absolute;left:50%;transform:translateX(-50%);top:104px;width:250px;
  background:rgba(2,26,21,.94);border:1px solid var(--line);border-radius:6px;
  padding:11px 13px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.node.avail:hover .card{opacity:1}
.node .card b{display:block;font-family:var(--disp);font-size:12px;color:var(--green);
  letter-spacing:.08em;margin-bottom:4px}
.node .card span{font-size:12px;line-height:1.4;color:var(--mint);opacity:.85}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:230px;height:230px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(5,221,77,.34),transparent 68%);
  animation:corepulse 3.1s ease-in-out infinite}
@keyframes corepulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.9)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.maptitle{position:absolute;top:88px;left:0;right:0;text-align:center;z-index:7}
.maphint{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:7;
  font-family:var(--disp);font-size:11px;letter-spacing:.22em;color:rgba(219,255,240,.5)}

.opt.sel{border-color:var(--green);background:rgba(5,221,77,.2);color:#fff}
.opt.sel .box{background:var(--green);color:var(--abyss)}
.opt.ok{border-color:var(--green);background:rgba(5,221,77,.24)}
.opt.bad{border-color:var(--alarm);background:rgba(255,68,56,.2)}

.tf{display:flex;gap:16px}
.tf .opt{flex:1;justify-content:center;font-family:var(--disp);
  font-size:19px;letter-spacing:.1em}
.srow{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.srow .idx{width:38px;height:38px;flex:none;border-radius:6px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--green);font-family:var(--disp);font-size:15px}
.srow .body{flex:1;padding:13px 17px;border-radius:6px;font-size:17px;
  background:rgba(1,20,16,.62);border:1px solid rgba(219,255,240,.2)}
.srow.ok .body{border-color:var(--green);background:rgba(5,221,77,.22)}
.srow.bad .body{border-color:var(--alarm);background:rgba(255,68,56,.18)}
.arrows{display:flex;flex-direction:column;gap:3px}
.arrows button{width:34px;height:24px;border-radius:4px;border:1px solid var(--line);
  color:var(--green);font-size:11px;line-height:1;background:rgba(2,26,21,.8)}
.arrows button:hover:not(:disabled){background:var(--green);color:var(--abyss)}
.arrows button:disabled{opacity:.22;cursor:default}
.qfoot{display:flex;justify-content:flex-end;margin-top:16px}

.lockin{font-family:var(--disp);font-size:34px;font-weight:700;text-align:center;
  letter-spacing:.42em;padding:16px 20px;width:100%;color:var(--green);
  background:rgba(1,20,16,.75);border:1px solid var(--line);border-radius:999px;outline:none}
.lockin:focus{box-shadow:0 0 32px rgba(5,221,77,.45)}
.lockerr{height:22px;margin-top:12px;color:#FF9A92;font-size:14px}

/* ---------- Resultados ---------- */
.kpis{display:flex;gap:14px;margin:18px 0}
.kpi{flex:1;border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center;

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid rgba(5,221,77,.18)}
th{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:rgba(219,255,240,.6)}

.ov.on{display:grid}
.ov .mask{position:absolute;inset:0;background:rgba(1,10,8,.86)}

.ovbox .row{display:flex;gap:16px;justify-content:center;margin-top:26px}

@keyframes slash{from{opacity:0;transform:translateX(-160px)}to{opacity:1;transform:none}}
.flash{position:absolute;inset:0;z-index:25;pointer-events:none;
  background:radial-gradient(circle,rgba(5,221,77,.5),transparent 70%);animation:fadeout .75s forwards}
@keyframes fadeout{to{opacity:0}}
.sweep{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.sweep::after{content:'';position:absolute;top:0;bottom:0;width:32%;
  background:linear-gradient(90deg,transparent,rgba(5,221,77,.35),transparent);
  animation:sweep 1s ease-out forwards}
@keyframes sweep{from{left:-35%}to{left:105%}}
.hint{position:absolute;bottom:8px;left:12px;z-index:40;font-size:10px;
  letter-spacing:.1em;color:rgba(219,255,240,.3)}
.brand{position:absolute;bottom:14px;right:16px;z-index:40;opacity:.5}
.brand svg{height:16px;width:auto;display:block}
</style>
</head>

/* =========================================================================
   SONIDO — sintetizado, sin archivos. Arranca en silencio.
   ========================================================================= */
const SFX = (()=>{
  let ctx=null, amb=null, on=false;
  const nuevo = ()=>{ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; };
  function tono(f1,f2,dur,tipo,vol){
    if(!on) return; const c=nuevo(), o=c.createOscillator(), g=c.createGain();
    o.type=tipo||'sine'; o.frequency.setValueAtTime(f1,c.currentTime);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }
  return {
    get activo(){ return on; },
    alternar(){
      on=!on;
      if(on){ const c=nuevo(); if(c.state==='suspended') c.resume(); this.ambiente(); }
      else if(amb){ amb.o.stop(); amb.o2.stop(); amb=null; }
      return on;
    },
    ambiente(){   /* zumbido grave de sala */
      if(!on||amb) return; const c=nuevo();
      const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
      o.type='sine'; o.frequency.value=54; o2.type='sine'; o2.frequency.value=81;
      f.type='lowpass'; f.frequency.value=260; g.gain.value=.05;
      o.connect(f); o2.connect(f); f.connect(g).connect(c.destination); o.start(); o2.start();
      amb={o,o2,g};
    },
    pulso(){ tono(880,null,.09,'sine',.10); },            /* latido del monitor */
    clic(){  tono(420,null,.05,'square',.05); },
    acierto(){ tono(660,1320,.34,'sine',.20); },
    fallo(){  tono(300,90,.75,'sawtooth',.22); },
    abrir(){  tono(520,1560,.5,'triangle',.20); },
    tic(){    tono(1500,null,.04,'square',.07); }
  };
})();

      </div></div>
    </div>
    <div class="floatbtn"><button class="btn solid" data-a="empezar">${esc(T.siguiente)} →</button></div>
  </div>`);
}

function tipoDe(e,q){ return q.tipoReto || e.tipoReto; }
function segDe(e,q){ return q.tiempoPorPregunta !== undefined ? q.tiempoPorPregunta : e.tiempoPorPregunta; }

function pPregunta(){
  const e = EST[S.est], q = e.preguntas[S.q], t = tipoDe(e,q);
  locked = false;
  let cuerpo = '';

  if(t === 'SORT'){
    work = barajar(q.items);
    cuerpo = filasSort();
  } else if(t === 'MULTI'){
    work = new Set();
    cuerpo = q.opciones.map((o,i)=>
      `<button class="opt" data-multi="${i}"><span class="box"></span>${esc(o.texto)}</button>`).join('');
  } else if(t === 'TRUEFALSE'){
    work = null;
    cuerpo = `<div class="tf">
      <button class="opt" data-tf="true"><span class="box"></span>VERDADERO</button>
      <button class="opt" data-tf="false"><span class="box"></span>FALSO</button></div>`;
  } else {
    work = null;
    cuerpo = q.opciones.map((o,i)=>
      `<button class="opt" data-single="${i}"><span class="box">${'ABCD'[i]||i+1}</span>${esc(o.texto)}</button>`).join('');
  }

  const seg = segDe(e,q);
  pinta(`<div class="screen on">${fondoDe(e.fondo)}
    <div class="layer">${barra({reloj:seg!=null, atras:true})}${vitales()}
      <div class="wrap"><div class="panel">
        <div class="qnum">${S.q+1}/${e.preguntas.length}</div>
        <p class="qtext">${esc(q.enunciado)}</p>
        <div id="cuerpo">${cuerpo}</div>
        <div class="qfoot"><button class="btn solid" id="enviar" data-a="enviar">${esc(T.enviar)}</button></div>
      </div></div>
    </div></div>`);

  SFX.pulso();
  if(seg != null) arrancarReloj(seg);
}

function barajar(items){
  if(items.length < 2) return items.slice();
  let a;
  for(let i=0;i<40;i++){
    a = items.slice();
    for(let j=a.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [a[j],a[k]]=[a[k],a[j]]; }
    if(!a.every((it,n)=>it.orden===n)) return a;
  }
  [a[0],a[1]]=[a[1],a[0]]; return a;
}
function filasSort(){
  return work.map((it,i)=>`<div class="srow" data-row="${i}">
    <div class="idx">${i+1}</div><div class="body">${esc(it.texto)}</div>
    <div class="arrows">
      <button data-up="${i}" ${i===0?'disabled':''} aria-label="Subir">▲</button>
      <button data-down="${i}" ${i===work.length-1?'disabled':''} aria-label="Bajar">▼</button>
    </div></div>`).join('');
}

function arrancarReloj(seg){
  timeLeft = seg;
  const pintarReloj = ()=>{
    const el = document.getElementById('timer'); if(!el) return;
    el.textContent = mmss(timeLeft);
    el.className = 'timer' + (timeLeft<=5?' crit' : timeLeft<=10?' warn' : '');
  };
  pintarReloj();
  timerId = setInterval(()=>{
    timeLeft--; pintarReloj();
    if(timeLeft<=5 && timeLeft>0) SFX.tic();
    if(timeLeft<=0){ clearInterval(timerId); timerId=null; fallar(); }
  }, 1000);
}

/* =========================================================================
   CORRECCIÓN  ← ÚNICO PUNTO A MOVER AL SERVIDOR EN PRODUCCIÓN
   ========================================================================= */
function evaluar(){
  const e = EST[S.est], q = e.preguntas[S.q], t = tipoDe(e,q);
  if(t === 'SORT')      return work.every((it,i)=>it.orden===i);
  if(t === 'TRUEFALSE') return work === q.respuesta;
  if(t === 'MULTI'){
    const need = new Set(q.opciones.map((o,i)=>o.correcta?i:-1).filter(i=>i>=0));
    return work.size===need.size && [...need].every(i=>work.has(i));
  }
  return work != null && q.opciones[work] && q.opciones[work].correcta === true;
}

function enviar(){
  if(locked) return; locked = true;
  if(timerId){ clearInterval(timerId); timerId=null; }
  const ok = evaluar();
  const b = document.getElementById('enviar');
  if(b){ b.textContent = T.enviado; b.disabled = true; }
  marcar(ok);
  if(ok){
    const e = EST[S.est], q = e.preguntas[S.q];
    S.aciertos++;
    S.puntos += q.puntos * CFG.escalaPuntos
              + (segDe(e,q)!=null ? Math.max(0,timeLeft) * CFG.bonusPorSegundoRestante : 0);
    SFX.acierto();
    const f = document.createElement('div'); f.className='flash'; stage.appendChild(f);
    setTimeout(siguientePregunta, 1150);
  } else {
    setTimeout(fallar, 650);
  }
}

function marcar(ok){
  const e = EST[S.est], q = e.preguntas[S.q], t = tipoDe(e,q);
  if(t === 'SORT'){
    document.querySelectorAll('.srow').forEach((r,i)=>
      r.classList.add(work[i].orden===i ? 'ok' : 'bad'));
  } else if(t === 'MULTI'){
    document.querySelectorAll('[data-multi]').forEach(b=>{
      const i=+b.dataset.multi; b.disabled=true;
      if(q.opciones[i].correcta) b.classList.add('ok');
      else if(work.has(i)) b.classList.add('bad');
    });
  } else if(t === 'TRUEFALSE'){
    document.querySelectorAll('[data-tf]').forEach(b=>{
      const v = b.dataset.tf==='true'; b.disabled=true;
      if(v===q.respuesta) b.classList.add('ok'); else if(v===work) b.classList.add('bad');
    });
  } else {
    document.querySelectorAll('[data-single]').forEach(b=>{
      const i=+b.dataset.single; b.disabled=true;
      if(q.opciones[i].correcta) b.classList.add('ok');
      else if(i===work) b.classList.add('bad');
    });
  }
}

function fallar(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  locked = true;
  S.intentos++; S.porEstacion[S.est].intentos++;
  S.puntos = Math.max(0, S.puntos - CFG.penalizacionPorReintento);
  SFX.fallo();
  const ov = document.createElement('div');
  ov.className='ov on'; ov.id='alarm';
  ov.innerHTML = `<div class="mask"></div><div class="slash"></div>
    <div class="ovbox">
      <h2>${esc(T.alarmaTitulo || 'CÓDIGO ROJO')}</h2>
      <p>${esc(T.alarmaTexto || 'El paciente se descompensa. Vuelvan a intentarlo antes de perderlo.')}</p>
      <div class="row">
        <button class="btn solid" data-a="reintentar">REPETIR ↻</button>
        ${CFG.permitirSalirDesdeAlarma?`<button class="btn ghost" data-a="mapa">${esc(T.volverAlMapa)}</button>`:''}
      </div></div>`;
  stage.appendChild(ov);
}

function siguientePregunta(){
  const e = EST[S.est];
  if(S.q < e.preguntas.length-1){ S.q++; pPregunta(); }
  else if(e.candadoDespues){ pCandado(e.candadoDespues); }
  else { completarEstacion(); }
}

/* ---------- Candado ---------- */
function pCandado(c){
  const e = EST[S.est];
  const esCodigo = (c.tipoReto === 'CODE');
  const cuerpo = esCodigo
    ? `<input class="lockin" id="codigo" maxlength="16" placeholder="${esc(c.placeholder||'')}" autocomplete="off">
       <div class="lockerr" id="lockerr"></div>
       <button class="btn solid" style="margin-top:6px" data-a="probar">${esc(c.boton||'DESBLOQUEAR')}</button>`
    : (work=null, c.opciones.map((o,i)=>
        `<button class="opt" data-lock="${i}"><span class="box">${'ABCD'[i]||i+1}</span>${esc(o.texto)}</button>`).join('')
       + `<div class="lockerr" id="lockerr"></div>
          <div class="qfoot"><button class="btn solid" data-a="probarOpcion">${esc(c.boton||'DESBLOQUEAR')}</button></div>`);

  pinta(`<div class="screen on">${fondoDe(e.fondo)}
    <div class="layer">${barra({atras:true})}${vitales()}
      <div class="wrap"><div class="panel" style="text-align:center;max-width:760px">
        <div class="kicker">${esc(c.titulo)}</div>
        <p class="qtext" style="margin:16px 0 20px;font-size:18px">${esc(c.enunciado)}</p>
        ${c.pista?`<p style="font-size:14px;color:var(--amber);margin-bottom:18px">▸ ${esc(c.pista)}</p>`:''}
        ${cuerpo}
      </div></div>
    </div></div>`);
  if(esCodigo) setTimeout(()=>{ const i=document.getElementById('codigo'); if(i) i.focus(); }, 60);
}

function probarCodigo(){
  const c = EST[S.est].candadoDespues;
  const inp = document.getElementById('codigo'), err = document.getElementById('lockerr');
  if(norm(inp.value) === norm(c.clave)){
    S.puntos += c.puntos * CFG.escalaPuntos; S.aciertos++;
    SFX.abrir(); abrirYSeguir();
  } else {
    err.textContent = 'Clave incorrecta. Revisen el registro del Copiloto.';
    inp.value=''; inp.focus(); SFX.fallo();
    S.intentos++; S.porEstacion[S.est].intentos++;
    S.puntos = Math.max(0, S.puntos - CFG.penalizacionPorReintento);
  }
}
function probarOpcion(){
  const c = EST[S.est].candadoDespues, err = document.getElementById('lockerr');
  if(work != null && c.opciones[work] && c.opciones[work].correcta){
    S.puntos += c.puntos * CFG.escalaPuntos; S.aciertos++;
    SFX.abrir(); abrirYSeguir();
  } else {
    err.textContent = 'Combinación incorrecta.';
    SFX.fallo(); S.intentos++; S.porEstacion[S.est].intentos++;
    S.puntos = Math.max(0, S.puntos - CFG.penalizacionPorReintento);
  }
}
function abrirYSeguir(){
  const s = document.createElement('div'); s.className='sweep'; stage.appendChild(s);
  setTimeout(completarEstacion, 950);
}

/* ---------- Cierre de estación ---------- */
function completarEstacion(){
  const e = EST[S.est];
  S.porEstacion[S.est].tiempo = Math.round((Date.now()-S.estT0)/1000);
  if(!S.gemas.includes(S.est)) S.gemas.push(S.est);
  pinta(`<div class="screen on">${fondoDe(e.fondo)}
    <div class="layer">${barra({casa:false})}${vitales()}
      <div class="wrap"><div class="panel" style="text-align:center">
        <div class="kicker">${esc(e.signoVital||'')} RECUPERADO</div>
        <div style="font-size:46px;margin:16px 0">🫀</div>
        <p class="narr">${esc(e.mensajeExito)}</p>
      </div></div>
    </div>
    <div class="floatbtn"><button class="btn solid" data-a="trasEstacion">${esc(T.siguiente)} →</button></div>
  </div>`);
  SFX.acierto();
}
function trasEstacion(){
  if(EST.every((_,i)=>S.gemas.includes(i))) pInforme(); else pMapa();
}

/* ---------- Informe ---------- */
function pInforme(){
  const total = Math.round((Date.now()-S.t0)/1000);
  const nQ = EST.reduce((a,e)=>a+e.preguntas.length+(e.candadoDespues?1:0),0);
  pinta(`<div class="screen on">${fondoDe(GAME.juego.hub.imagenMapa)}
    <div class="layer">${barra({casa:false})}
      <div class="wrap"><div class="panel">
        <div class="kicker" style="text-align:center">${esc(T.resultadosTitulo)}</div>
        <div class="kpis">
          <div class="kpi"><b>${S.puntos}</b><span>PUNTOS</span></div>
          <div class="kpi"><b>${S.aciertos}/${nQ}</b><span>ACIERTOS</span></div>
          <div class="kpi"><b>${S.intentos}</b><span>REINTENTOS</span></div>
          <div class="kpi"><b>${mmss(total)}</b><span>TIEMPO</span></div>
        </div>
        <table><thead><tr><th>ESTACIÓN</th><th>REINTENTOS</th><th>TIEMPO</th></tr></thead>
          <tbody>${S.porEstacion.map(p=>
            `<tr><td>${esc(p.nombre)}</td><td>${p.intentos}</td><td>${mmss(p.tiempo)}</td></tr>`).join('')}
          </tbody></table>
        <p style="text-align:center;margin-top:18px;font-size:16px">${esc(GAME.juego.cierre)}</p>
      </div></div>
    </div>
    <div class="floatbtn"><button class="btn solid" data-a="gracias">${esc(T.finalizar)}</button></div>
  </div>`);
}
function pGracias(){
  pinta(`<div class="screen on">${fondoDe(GAME.juego.imagenPortada)}
    <div class="layer"><div class="center">
      <div class="titlebox"><h1 style="font-size:40px">${esc(GAME.juego.agradecimiento)}</h1></div>
      <button class="btn" data-a="reiniciar">VOLVER A EMPEZAR ↻</button>
    </div></div></div>`);
}

/* ---------- Confirmación de salida ---------- */
function confirmarSalida(){
  const ov = document.createElement('div'); ov.className='ov on'; ov.id='salida';
  ov.innerHTML = `<div class="mask"></div><div class="ovbox">
    <h2>${esc(T.salirTitulo)}</h2><p>${esc(T.salirTexto)}</p>
    <div class="row">
      <button class="btn ghost" data-a="cerrarOv">${esc(T.salirCancelar)}</button>
      <button class="btn solid" data-a="reiniciar">${esc(T.salirConfirmar)}</button>
    </div></div>`;
  stage.appendChild(ov);
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
stage.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-a],[data-single],[data-multi],[data-tf],[data-lock],[data-up],[data-down]');
  if(!t) return;

  if(t.dataset.up !== undefined || t.dataset.down !== undefined){
    const i = +(t.dataset.up ?? t.dataset.down);
    const j = t.dataset.up !== undefined ? i-1 : i+1;
    [work[i],work[j]] = [work[j],work[i]];
    document.getElementById('cuerpo').innerHTML = filasSort();
    SFX.clic(); return;
  }
  if(t.dataset.multi !== undefined){
    if(locked) return; const i = +t.dataset.multi;
    if(work.has(i)){ work.delete(i); t.classList.remove('sel'); t.querySelector('.box').textContent=''; }
    else { work.add(i); t.classList.add('sel'); t.querySelector('.box').textContent='✓'; }
    SFX.clic(); return;
  }
  if(t.dataset.tf !== undefined){
    if(locked) return; work = t.dataset.tf==='true';
    document.querySelectorAll('[data-tf]').forEach(b=>{
      b.classList.remove('sel'); b.querySelector('.box').textContent=''; });
    t.classList.add('sel'); t.querySelector('.box').textContent='✓'; SFX.clic(); return;
  }
  if(t.dataset.single !== undefined){
    if(locked) return; work = +t.dataset.single;
    document.querySelectorAll('[data-single]').forEach((b,i)=>{
      b.classList.toggle('sel', i===work);
      b.querySelector('.box').textContent = 'ABCD'[i]||i+1; });
    SFX.clic(); return;
  }
  if(t.dataset.lock !== undefined){
    work = +t.dataset.lock;
    document.querySelectorAll('[data-lock]').forEach((b,i)=>b.classList.toggle('sel', i===work));
    SFX.clic(); return;
  }

  switch(t.dataset.a){
    case 'intro':        pIntro(); break;
    case 'mapa':         pMapa(); break;
    case 'estacion':     S.est = +t.dataset.i; S.q = 0; pBriefing(); break;
    case 'empezar':      S.estT0 = Date.now(); pPregunta(); break;
    case 'enviar':       enviar(); break;
    case 'reintentar':   pPregunta(); break;
    case 'probar':       probarCodigo(); break;
    case 'probarOpcion': probarOpcion(); break;
    case 'trasEstacion': trasEstacion(); break;
    case 'informe':      pInforme(); break;
    case 'gracias':      pGracias(); break;
    case 'salir':        confirmarSalida(); break;
    case 'cerrarOv':     document.getElementById('salida')?.remove(); break;
    case 'reiniciar':    reset(); pPortada(); break;
    case 'sonido':       SFX.alternar(); t.textContent = SFX.activo?'🔊':'🔇'; break;
  }
});

addEventListener('keydown', e=>{
  const inp = document.getElementById('codigo');
  if(e.key === 'Enter' && inp && document.activeElement === inp){ probarCodigo(); return; }
  if(inp) return;
  if(e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.().catch(()=>{});
  if(e.key.toLowerCase() === 'r'){ reset(); pPortada(); }
});

/* arranque */
reset(); ajustar(); pPortada();
</script>
</body>
</html>
