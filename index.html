<style>

  --green:#05DD4D; --green-soft:#3BFF7E; --deep:#01332B; --abyss:#02120E;
  --mint:#DBFFF0; --teal:#0A7B6B; --alarm:#FF4438; --amber:#FFC24A;
  --panel:rgba(2,26,21,.74); --line:rgba(5,221,77,.42);
  --disp:'Orbitron',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--mint);
  font-family:var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}


#viewport{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;
  transform-origin:center center;background:var(--abyss);box-shadow:0 0 90px rgba(5,221,77,.13)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.bg{position:absolute;inset:0;background-size:cover;background-position:center;
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.scrim{position:absolute;inset:0;
  background:radial-gradient(72% 62% at 50% 50%,rgba(4,12,16,.32),rgba(3,9,12,.90) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.layer{position:relative;z-index:3;flex:1;display:flex;flex-direction:column}

h1{font-family:var(--disp);font-size:52px;font-weight:900;letter-spacing:.03em;line-height:1.05}
h2{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.06em}
.kicker{font-family:var(--disp);font-size:15px;font-weight:500;letter-spacing:.34em;
  color:var(--green);text-shadow:0 0 18px rgba(5,221,77,.7)}

.btn{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:15px 34px;border-radius:999px;border:1px solid var(--line);
  background:rgba(2,26,21,.8);color:var(--green);transition:.16s;
  display:inline-flex;align-items:center;gap:12px}
.btn:hover:not(:disabled){background:var(--green);color:var(--abyss);box-shadow:0 0 30px rgba(5,221,77,.6)}
.btn.solid{background:var(--green);color:var(--abyss);border-color:var(--green)}
.btn.solid:hover:not(:disabled){background:var(--green-soft);box-shadow:0 0 40px rgba(5,221,77,.8)}
.btn.ghost{color:var(--mint);border-color:rgba(219,255,240,.4)}
.btn.ghost:hover{background:rgba(219,255,240,.14);color:var(--mint);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(2,26,21,.8);color:var(--green);font-size:18px;transition:.16s}
.ico:hover{background:var(--green);color:var(--abyss)}

.top{position:absolute;top:20px;left:20px;right:20px;z-index:8;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.tl,.tr{display:flex;gap:10px;align-items:center}
.timer{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.1em;color:var(--green);
  border:1px solid var(--line);background:rgba(2,26,21,.85);padding:10px 22px;
  border-radius:999px;min-width:120px;text-align:center}
.timer.warn{color:var(--amber);border-color:var(--amber)}
.timer.crit{color:var(--alarm);border-color:var(--alarm);animation:pulse .55s infinite}
@keyframes pulse{50%{opacity:.4}}
.score{font-family:var(--disp);font-size:14px;letter-spacing:.12em;color:var(--mint);
  border:1px solid rgba(219,255,240,.28);background:rgba(2,26,21,.7);padding:11px 18px;border-radius:999px}

.vitals{position:absolute;right:20px;top:96px;z-index:8;display:flex;flex-direction:column;gap:10px}
.vital{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;
  border:1px solid rgba(219,255,240,.22);background:rgba(2,26,21,.7);transition:.3s}
.vital svg{width:36px;height:22px}
.vital polyline{fill:none;stroke:rgba(219,255,240,.28);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vital.got{border-color:var(--green);box-shadow:0 0 26px rgba(5,221,77,.55)}
.vital.got polyline{stroke:var(--green);filter:drop-shadow(0 0 5px var(--green));animation:beat 1.5s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.65}50%{opacity:1}}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.titlebox{background:var(--panel);border:1px solid var(--line);padding:32px 74px;text-align:center;
  backdrop-filter:blur(3px);border-radius:6px;
  box-shadow:0 0 60px rgba(5,221,77,.16),inset 0 0 40px rgba(0,0,0,.35)}
.wrap{flex:1;display:grid;place-items:center;padding:92px 110px 34px}
.panel{width:100%;max-width:900px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:34px 40px;backdrop-filter:blur(3px);
  box-shadow:0 0 50px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.25)}
.narr{font-size:19px;line-height:1.6;text-align:center;color:var(--mint)}
.floatbtn{position:absolute;bottom:34px;right:34px;z-index:8}

.inp{width:100%;background:rgba(1,20,16,.75);border:1px solid var(--line);border-radius:999px;
  padding:14px 24px;font-size:17px;color:var(--mint);outline:none;text-align:center}
.inp:focus{box-shadow:0 0 26px rgba(5,221,77,.35)}
.inp::placeholder{color:rgba(219,255,240,.32)}

.node{position:absolute;width:150px;transform:translate(-50%,-50%);z-index:6;text-align:center;transition:.2s}
.node .ring{width:66px;height:66px;margin:0 auto;border-radius:50%;
  border:2px solid rgba(219,255,240,.25);display:grid;place-items:center;
  font-family:var(--disp);font-size:20px;font-weight:700;color:rgba(219,255,240,.35);
  background:rgba(2,26,21,.55);transition:.25s}
.node .lbl{margin-top:8px;font-family:var(--disp);font-size:11px;letter-spacing:.12em;
  color:rgba(219,255,240,.45);text-transform:uppercase}
.node.locked{filter:grayscale(.7)}
.node.done .ring{border-color:var(--green);color:var(--green);box-shadow:0 0 30px rgba(5,221,77,.6)}
.node.done .lbl{color:var(--green)}
.node.avail{cursor:pointer}
.node.avail .ring{border-color:var(--green-soft);color:var(--green-soft);animation:halo 1.7s ease-in-out infinite}
.node.avail .lbl{color:var(--mint)}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.08)}
@keyframes halo{0%,100%{box-shadow:0 0 18px rgba(5,221,77,.45)}
  50%{box-shadow:0 0 46px rgba(5,221,77,.95),0 0 90px rgba(5,221,77,.35)}}
.node .card{position:absolute;left:50%;transform:translateX(-50%);top:104px;width:250px;
  background:rgba(2,26,21,.94);border:1px solid var(--line);border-radius:6px;padding:11px 13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:9}
.node.avail:hover .card{opacity:1}
.node .card b{display:block;font-family:var(--disp);font-size:12px;color:var(--green);
  letter-spacing:.08em;margin-bottom:4px}
.node .card span{font-size:12px;line-height:1.4;color:var(--mint);opacity:.85}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:230px;height:230px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(5,221,77,.34),transparent 68%);
  animation:corepulse 3.1s ease-in-out infinite}
@keyframes corepulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.9)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
/* Arriba, no en el centro: con cinco estaciones el edificio central del mapa
   lo ocupa el nodo de E5, y el titulo lo tapaba por completo. */
.maptitle{position:absolute;top:17%;left:0;right:0;text-align:center;z-index:7;
  text-shadow:0 2px 24px rgba(0,0,0,.9)}
.maphint{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:7;
  font-family:var(--disp);font-size:11px;letter-spacing:.22em;color:rgba(219,255,240,.5)}

.qnum{font-family:var(--disp);font-size:30px;font-weight:900;color:var(--green);
  letter-spacing:.16em;margin-bottom:10px}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin-bottom:22px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;
  margin-bottom:10px;border-radius:6px;background:rgba(1,20,16,.62);
  border:1px solid rgba(219,255,240,.2);color:var(--mint);font-size:17px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--green);background:rgba(5,221,77,.12)}
.opt .box{width:26px;height:26px;border-radius:50%;border:1px solid var(--green);flex:none;
  display:grid;place-items:center;font-family:var(--disp);font-size:12px;color:var(--green)}
.opt.sel{border-color:var(--green);background:rgba(5,221,77,.2);color:#fff}
.opt.sel .box{background:var(--green);color:var(--abyss)}
.opt.ok{border-color:var(--green);background:rgba(5,221,77,.28)}
.opt.bad{border-color:var(--alarm);background:rgba(255,68,56,.22)}
.opt:disabled{cursor:default}
.tf{display:flex;gap:16px}
.tf .opt{flex:1;justify-content:center;font-family:var(--disp);font-size:19px;letter-spacing:.1em}
.srow{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.srow .idx{width:38px;height:38px;flex:none;border-radius:6px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--green);font-family:var(--disp);font-size:15px}
.srow .body{flex:1;padding:13px 17px;border-radius:6px;font-size:17px;
  background:rgba(1,20,16,.62);border:1px solid rgba(219,255,240,.2)}
.srow.ok .body{border-color:var(--green);background:rgba(5,221,77,.26)}
.srow.bad .body{border-color:var(--alarm);background:rgba(255,68,56,.2)}
.arrows{display:flex;flex-direction:column;gap:3px}
.arrows button{width:34px;height:24px;border-radius:4px;border:1px solid var(--line);
  color:var(--green);font-size:11px;line-height:1;background:rgba(2,26,21,.8)}
.arrows button:hover:not(:disabled){background:var(--green);color:var(--abyss)}
.arrows button:disabled{opacity:.22;cursor:default}
.qfoot{display:flex;justify-content:flex-end;margin-top:16px}

.lockin{font-family:var(--disp);font-size:34px;font-weight:700;text-align:center;letter-spacing:.42em;
  padding:16px 20px;width:100%;color:var(--green);background:rgba(1,20,16,.75);
  border:1px solid var(--line);border-radius:999px;outline:none}
.lockin:focus{box-shadow:0 0 32px rgba(5,221,77,.45)}
.lockerr{height:22px;margin-top:12px;color:#FF9A92;font-size:14px}

.kpis{display:flex;gap:14px;margin:18px 0}
.kpi{flex:1;border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center;background:rgba(1,20,16,.5)}
.kpi b{display:block;font-family:var(--disp);font-size:26px;color:var(--green)}
.kpi span{font-size:10px;letter-spacing:.16em;color:rgba(219,255,240,.6)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid rgba(5,221,77,.18)}
th{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:rgba(219,255,240,.6)}

.ov{position:absolute;inset:0;z-index:30;display:grid;place-items:center}
.ov .mask{position:absolute;inset:0;background:rgba(1,10,8,.86)}
.ovbox{position:relative;background:linear-gradient(180deg,rgba(3,44,35,.97),rgba(1,22,18,.97));
  border:1px solid var(--line);border-radius:8px;padding:40px 52px;text-align:center;max-width:760px}
.ovbox p{margin-top:12px;font-size:17px;color:var(--mint);opacity:.9}
.ovbox .row{display:flex;gap:16px;justify-content:center;margin-top:26px}
/* Rojo de alerta: lo comparten «se agotó el tiempo» y «respuesta incorrecta». */
#alarm .mask, #incorrecta .mask{background:rgba(120,10,6,.86)}
#alarm .ovbox, #incorrecta .ovbox{border-color:rgba(255,120,110,.75);
  background:linear-gradient(180deg,rgba(70,8,5,.97),rgba(28,3,2,.97))}
#alarm h2, #incorrecta h2{color:#FF9A92}
/* El barrido a opacidad plena tapaba la sala entera. Aqui se queda a media
   luz: alerta, pero deja leer. La de «tiempo agotado» conserva su fuerza. */
#incorrecta .slash{animation:slashSuave .75s ease-out forwards}
@keyframes slashSuave{from{opacity:0;transform:translateX(-160px)}to{opacity:.4;transform:none}}
#incorrecta .fallos{font-family:var(--disp);font-size:64px;font-weight:900;
  color:#FF9A92;line-height:1;margin:18px 0 4px}
#incorrecta .cual{margin-top:16px;padding:12px 18px;border-radius:8px;
  border:1px solid rgba(255,120,110,.4);background:rgba(255,120,110,.09);
  font-size:15px;color:#FFC9C4}
.slash{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,68,56,.5) 0 90px,transparent 90px 230px);
  animation:slash .75s ease-out}
@keyframes slash{from{opacity:0;transform:translateX(-160px)}to{opacity:1;transform:none}}
/* ---------- Luz: el acierto tiene que verse desde el fondo de la sala ---------- */
.flash{position:absolute;inset:0;z-index:25;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(180,255,210,.92),rgba(5,221,77,.6) 38%,transparent 74%);
  animation:destello .85s ease-out forwards}
@keyframes destello{
  0%{opacity:0;transform:scale(.82)}
  12%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.15)}}
/* onda expansiva que acompaña al destello */
.onda{position:absolute;left:50%;top:50%;z-index:26;pointer-events:none;
  width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  border:3px solid rgba(150,255,195,.95);animation:onda .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes onda{from{transform:scale(.3);opacity:1}to{transform:scale(11);opacity:0}}

.sweep{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle,rgba(5,221,77,.22),transparent 70%)}
.sweep::after{content:'';position:absolute;top:0;bottom:0;width:42%;
  background:linear-gradient(90deg,transparent,rgba(160,255,200,.85),rgba(5,221,77,.5),transparent);
  filter:blur(2px);animation:sweep 1.35s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes sweep{from{left:-45%}to{left:110%}}

/* Luz ambiente de la sala: late como un monitor, sobre el fondo ilustrado. */
.latido{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(58% 48% at 50% 46%,rgba(5,221,77,.07),transparent 72%);
  animation:latido 2.6s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:.25}42%{opacity:.7}55%{opacity:.4}}

/* Alarma: además del barrido, el borde de la pantalla respira en rojo. */
.vineta{position:absolute;inset:0;z-index:24;pointer-events:none;
  box-shadow:inset 0 0 140px 40px rgba(255,68,56,.75);animation:vineta .85s ease-in-out infinite}
@keyframes vineta{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- Avisos de tiempo ----------
   El equipo está de espaldas a la tablet, con las manos en el material: el
   número del reloj no lo ve nadie. El borde de la pantalla sí se ve desde el
   fondo de la sala, así que los cruces de tiempo se anuncian con luz. */
.aviso{position:absolute;inset:0;z-index:24;pointer-events:none;
  box-shadow:inset 0 0 120px 32px rgba(255,194,74,.7);animation:avisoPulso 1.7s ease-in-out forwards}
.aviso.rojo{box-shadow:inset 0 0 130px 36px rgba(255,68,56,.7)}
@keyframes avisoPulso{0%,100%{opacity:0}22%{opacity:1}45%{opacity:.25}68%{opacity:1}}
/* Último minuto: no es un destello, es un estado. No para hasta que cierran. */
.ultimo{position:absolute;inset:0;z-index:23;pointer-events:none;
  box-shadow:inset 0 0 110px 30px rgba(255,68,56,.5);animation:vineta 1.1s ease-in-out infinite}
/* Interruptor de sonido: antes era un icono mudo y nadie lo encontraba. */
.son{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 18px;
  border-radius:999px;border:1px solid rgba(219,255,240,.35);background:rgba(2,26,21,.85);
  color:rgba(219,255,240,.75);font-family:var(--disp);font-size:11px;
  font-weight:700;letter-spacing:.16em;transition:.16s}
.son span{font-size:16px;line-height:1}
.son:hover{border-color:var(--green);color:var(--green)}
.son.on{border-color:var(--green);color:var(--green);background:rgba(5,221,77,.14);
  box-shadow:0 0 22px rgba(5,221,77,.35)}
.avisoSon{margin-top:6px;padding:11px 24px;border-radius:999px;
  border:1px dashed rgba(255,194,74,.7);background:rgba(255,194,74,.1);
  color:var(--amber);font-family:var(--body);font-size:14px;font-weight:600;
  animation:respira 2.2s ease-in-out infinite}
.avisoSon:hover{background:rgba(255,194,74,.22)}
@keyframes respira{50%{opacity:.55}}
.hint{position:absolute;bottom:8px;left:12px;z-index:40;font-size:10px;letter-spacing:.1em;color:rgba(219,255,240,.3)}
.brand{position:absolute;bottom:14px;right:16px;z-index:40;opacity:.5}
.brand svg{height:16px;width:auto;display:block}
.spin{width:38px;height:38px;border:3px solid rgba(5,221,77,.2);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- Debe ir al FINAL: sobrescribe reglas declaradas más arriba --- */
/* «Reducir movimiento» apagaba TODAS las animaciones y dejaba el juego sin una
   sola luz. Lo que molesta a quien activa esa opción es el desplazamiento y el
   zoom, no el brillo: se quita el movimiento y se conserva la luz que informa. */
@media (prefers-reduced-motion:reduce){
  .bg{animation:none}                         /* fuera la deriva del fondo */
  .onda{display:none}                         /* fuera la onda expansiva */
  .sweep::after{animation:none;left:0;width:100%;filter:none;opacity:.5}
  .slash{animation:none}
  .node.avail:hover{transform:translate(-50%,-50%)}
  .flash{animation:destelloQuieto .85s ease-out forwards}
  .core{animation:nucleoQuieto 3.1s ease-in-out infinite}
  /* Los avisos de tiempo son informacion, no adorno: se conservan encendidos. */
  .aviso{animation:avisoQuieto 1.7s ease-out forwards}
  .ultimo{animation:none;opacity:.8}
}
@keyframes avisoQuieto{0%,100%{opacity:0}20%,75%{opacity:1}}
@keyframes destelloQuieto{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes nucleoQuieto{0%,100%{opacity:.45}50%{opacity:1}}
</style>

/* Coordenadas de los cuatro modulos del mapa ilustrado. Si se cambia la
   imagen del mapa, hay que reajustarlas o los nodos flotan en el vacio. */
/* E5 va en el edificio circular del centro, que en el mapa es el unico modulo
   que quedaba libre — y ademas es el que corona el recorrido. */
const NODOS = [{x:28,y:32},{x:72,y:32},{x:20,y:65},{x:81,y:65},{x:50,y:47}];

const stage = document.getElementById('stage');

/* ---------------- Sonido sintetizado ----------------
   El ambiente de la primera version eran dos senoidales a 55 y 82,5 Hz con un
   paso bajo a 320 Hz. En el analizador se veia; por el altavoz de una tablet,
   que no baja de unos 150-200 Hz, NO SALIA. De ahi que sonara «bajito»: no era
   el volumen, era el rango. Ahora la energia esta donde un altavoz pequeno la
   reproduce, y todo pasa por un limitador para poder subir sin distorsionar.

   Tres capas continuas: un drone con batido lento, una capa de aire filtrado y
   un pulso periodico de monitor con cola de sala. La reverberacion es lo que
   hace que un sinte suene a nave y no a pitido de microondas. */
const SFX = (()=>{
  let ctx=null, master=null, rever=null, amb=null, pingId=null, on=false, modo='calma';
  const MAESTRO = 1.0;
  /* Cada modo es una mezcla distinta: mismo motor, distinta tension.
     El drone es SOPORTE, no protagonista: a 0,17 se comia la mezcla y resultaba
     invasivo durante la validacion, 18 dB por encima de la capa de aire. Va
     ocho veces mas bajo y sin pico resonante. Si hay que retocar el ambiente,
     es aqui: 'drone' es el zumbido de fondo, 'aire' la ventilacion. */
  const MODOS = {
    calma:   {drone:.030, aire:.07, brillo:420, ping:5200, pingVol:.09},
    sala:    {drone:.040, aire:.11, brillo:560, ping:3600, pingVol:.12},
    tension: {drone:.065, aire:.15, brillo:850, ping:1300, pingVol:.17},
  };

  function nuevo(){
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = MAESTRO;
      /* Limitador: permite subir el nivel percibido sin que sature en el
         altavoz de la tablet, que es donde esto se va a oir de verdad. */
      const lim = ctx.createDynamicsCompressor();
      lim.threshold.value=-9; lim.knee.value=6; lim.ratio.value=12;
      lim.attack.value=.003; lim.release.value=.25;
      master.connect(lim).connect(ctx.destination);
      rever = ctx.createConvolver(); rever.buffer = colaDeSala(2.8, 2.6);
      const gRev = ctx.createGain(); gRev.gain.value = .9;
      rever.connect(gRev).connect(master);
    }
    return ctx;
  }
  /** Impulso sintetico: ruido que decae. Da la sensacion de sala grande. */
  function colaDeSala(seg, caida){
    const n = Math.floor(ctx.sampleRate*seg), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = b.getChannelData(ch);
      for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, caida);
    }
    return b;
  }
  function ruidoBuffer(seg){
    const n = Math.floor(ctx.sampleRate*seg), b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return b;
  }
  /** Envia una fuente a la mezcla seca y, si se pide, tambien a la sala. */
  function salida(nodo, wet){
    nodo.connect(master);
    if(wet){ const w = ctx.createGain(); w.gain.value = wet; nodo.connect(w).connect(rever); }
  }
  /** Un golpe de tono. dur en segundos, vol de 0 a 1 antes de la maestra. */
  function tono(f1,f2,dur,tipo,vol,retraso,wet){
    if(!on) return; const c=nuevo(), t=c.currentTime+(retraso||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=tipo||'sine'; o.frequency.setValueAtTime(f1,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); salida(g, wet===undefined ? .35 : wet);
    o.start(t); o.stop(t+dur+.05);
  }
  /** Ruido filtrado, para golpes y barridos. */
  function ruido(dur,f0,f1,vol,wet){
    if(!on) return; const c=nuevo(), t=c.currentTime;
    const n=c.createBufferSource(); n.buffer=ruidoBuffer(dur);
    const f=c.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    f.Q.value=1.4;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f).connect(g); salida(g, wet===undefined ? .3 : wet);
    n.start(t); n.stop(t+dur);
  }
  /** El pulso del monitor, muy reverberado: es lo que mantiene viva la sala. */
  function ping(){
    const m = MODOS[modo];
    tono(1568, null, .55, 'sine', m.pingVol, 0, .95);
    tono(2350, null, .30, 'sine', m.pingVol*.4, .04, .95);
  }
  function programarPing(){
    clearInterval(pingId);
    pingId = setInterval(function(){ if(on && amb) ping(); }, MODOS[modo].ping);
  }
  return {
    get activo(){ return on; },
    alternar(){
      on = !on;
      if(on){ const c=nuevo(); if(c.state==='suspended') c.resume(); this.ambiente(); this.abrir(); }
      else { this.parar(); }
      return on;
    },
    parar(){
      clearInterval(pingId); pingId=null;
      if(amb){ amb.nodos.forEach(function(n){ try{ n.stop(); }catch(e){} }); amb=null; }
    },
    /** Cambia la tension del ambiente sin cortarlo: rampas, nunca saltos. */
    capa(nombre){
      if(!MODOS[nombre] || modo===nombre) return;
      modo = nombre;
      if(!amb) return;
      const c=nuevo(), t=c.currentTime, m=MODOS[nombre];
      amb.gDrone.gain.linearRampToValueAtTime(m.drone, t+1.2);
      amb.gAire.gain.linearRampToValueAtTime(m.aire,  t+1.2);
      amb.fDrone.frequency.linearRampToValueAtTime(m.brillo, t+1.2);
      programarPing();
    },
    ambiente(){
      if(!on||amb) return; const c=nuevo(), m=MODOS[modo];
      /* 1) Drone: dos sierras casi al unisono producen un batido lento — el
            «motor» de la nave. 110 Hz y sus armonicos SI salen por un altavoz
            pequeno, al contrario que los 55 Hz de antes. */
      const o1=c.createOscillator(), o2=c.createOscillator(), o3=c.createOscillator();
      o1.type='sawtooth'; o1.frequency.value=110;
      o2.type='sawtooth'; o2.frequency.value=110.35;   /* batido de ~0,35 Hz */
      o3.type='sine';     o3.frequency.value=220;
      /* Q bajo a proposito: con Q=7 el filtro creaba un pico resonante en el
         corte y el drone chirriaba. Aqui el filtro solo recorta, no canta. */
      const fDrone=c.createBiquadFilter(); fDrone.type='lowpass';
      fDrone.frequency.value=m.brillo; fDrone.Q.value=0.7;
      const gDrone=c.createGain(); gDrone.gain.value=m.drone;
      o1.connect(fDrone); o2.connect(fDrone); o3.connect(fDrone);
      fDrone.connect(gDrone); salida(gDrone, .25);
      /* 2) Aire: ventilacion de sala presurizada, con barrido lento del filtro. */
      const aire=c.createBufferSource(); aire.buffer=ruidoBuffer(6); aire.loop=true;
      const fAire=c.createBiquadFilter(); fAire.type='bandpass';
      fAire.frequency.value=1400; fAire.Q.value=.8;
      const gAire=c.createGain(); gAire.gain.value=m.aire;
      const lfo=c.createOscillator(); lfo.frequency.value=.07;
      const lgo=c.createGain(); lgo.gain.value=650;
      lfo.connect(lgo).connect(fAire.frequency);
      aire.connect(fAire).connect(gAire); salida(gAire, .5);
      o1.start(); o2.start(); o3.start(); aire.start(); lfo.start();
      amb={nodos:[o1,o2,o3,aire,lfo], gDrone, gAire, fDrone};
      programarPing();
    },
    pulso(){  tono(920,null,.14,'sine',.55); tono(1380,null,.08,'sine',.24,.03); },
    clic(){   tono(520,null,.07,'square',.32); },
    acierto(){ tono(660,null,.18,'sine',.70); tono(990,null,.32,'sine',.60,.12);
               tono(1320,null,.45,'triangle',.44,.24,.9); },
    fallo(){  tono(320,70,.95,'sawtooth',.78); ruido(.5,1400,180,.38); },
    abrir(){  tono(520,1560,.55,'triangle',.70); tono(780,2340,.45,'sine',.36,.08);
              ruido(.55,600,4200,.24,.8); },
    tic(){    tono(1700,null,.06,'square',.46); },
    entrar(){ tono(180,60,.7,'sine',.60); ruido(.6,300,90,.30,.7);
              tono(1200,240,.9,'sawtooth',.16,.05,.9); }
  };
})();

/* ---------------- Luces ----------------
   REGLA: una luz se enciende SIEMPRE despues de pinta(), nunca antes.
   pinta() reescribe el stage entero, asi que un destello anadido antes se
   borra en el mismo instante sin llegar a dibujarse — que es exactamente lo
   que le pasaba al destello del cierre de estacion. */
function luz(clases, ms){
  (Array.isArray(clases) ? clases : [clases]).forEach(function(c){
    const d = document.createElement('div'); d.className = c; stage.appendChild(d);
    setTimeout(function(){ d.remove(); }, ms || 1800);
  });
}
/** Capa persistente del ultimo minuto. Se repone sola en cada tic del reloj,
    asi que sobrevive a los repintados sin depender de quien pinte. */
function capaUltimo(encendida){
  const hay = document.getElementById('ultimo');
  if(encendida && !hay){
    const d = document.createElement('div'); d.className='ultimo'; d.id='ultimo';
    stage.appendChild(d);
  } else if(!encendida && hay){ hay.remove(); }
}

};

/* Preguntas de la estacion, con el candado de salida al final. */
function preguntasDe(e){ return e.candadoDespues ? e.preguntas.concat([e.candadoDespues]) : e.preguntas.slice(); }

/* ---------- Reloj de estacion: 12 minutos, parametro del cliente ----------
   Cuenta contra el reloj de pared, no contra los ticks del intervalo: pinta()
   destruye el intervalo en cada repintado a proposito (para no dejar relojes
   huerfanos corriendo por detras), asi que el tiempo no puede vivir en el
   contador. El instante de fin se ancla la PRIMERA vez que se entra a la
   estacion: volver al mapa y reentrar ya no regala 12 minutos nuevos. */
/* Momentos en que la sala tiene que enterarse de la hora sin mirar el reloj. */
const AVISOS = [{seg:360, clase:'aviso'}, {seg:180, clase:'aviso'}, {seg:60, clase:'aviso rojo'}];

function restante(e){ e = e || EST[S.est];
  return S.finEst[e.id] === undefined ? segEstacion(e)
       : Math.ceil((S.finEst[e.id] - Date.now())/1000); }

function arrancarReloj(e){
  if(S.finEst[e.id] === undefined) S.finEst[e.id] = Date.now() + segEstacion(e)*1000;
  S.agotado = restante(e) <= 0;   // reentrar a una estacion vencida no repite la alarma
  reanudarReloj();
}
/** Se llama despues de cada pinta() de pantalla con reloj, para rearmarlo. */
function reanudarReloj(){
  clearInterval(timerId);
  timeLeft = restante(); pintarReloj();
  timerId = setInterval(function(){
    const antes = timeLeft; timeLeft = restante(); pintarReloj();
    if(timeLeft>0 && timeLeft<=10 && timeLeft!==antes) SFX.tic();
    /* Cruces de tiempo: mitad, tres minutos y ultimo minuto. Se comparan contra
       la lectura anterior, asi que cada uno se dispara una sola vez aunque el
       reloj pegue un salto (tablet en segundo plano). */
    AVISOS.forEach(function(a){
      if(antes > a.seg && timeLeft <= a.seg){ luz(a.clase, 1800); SFX.tic(); }
    });
    capaUltimo(timeLeft > 0 && timeLeft <= 60);
    /* El ambiente sube de tension con el reloj. capa() ignora la repeticion,
       asi que llamarlo en cada tic es seguro y se autocorrige. */
    SFX.capa(timeLeft <= 60 ? 'tension' : 'sala');
    /* Al llegar a cero NO se detiene: sigue hacia negativo para que el cierre
       reporte mas de 720 s y el servidor no asigne bonificacion. */
    if(timeLeft<=0 && !S.agotado){ S.agotado = true; alarmaTiempo(); }
  }, 1000);
}
function pintarReloj(){
  const el = document.getElementById('timer'); if(!el) return;
  el.textContent = mmss(timeLeft);
  el.className = 'timer' + (timeLeft<=60 ? ' crit' : timeLeft<=240 ? ' warn' : '');
}
/* Se agotaron los 12 minutos. Se puede cerrar igual, pero sin bonificacion. */
function alarmaTiempo(){
  if(document.getElementById('alarm')) return;
  SFX.fallo();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='alarm';
  ov.innerHTML = '<div class="mask"></div><div class="slash"></div><div class="vineta"></div>'
    + '<div class="ovbox"><h2>SE AGOT&Oacute; EL TIEMPO</h2>'
    + '<p>Pasaron los ' + mmss(segEstacion(EST[S.est])) + ' de la estaci&oacute;n. '
    + 'Pueden cerrarla igual: conservan los puntos de sus respuestas, pero sin bonificaci&oacute;n.</p>'
    + '<div class="row">'
    + '<button class="btn solid" data-a="revisar">REVISAR Y CERRAR</button>'
    + '<button class="btn ghost" data-a="mapa">' + esc(T.volverAlMapa) + '</button>'
    + '</div></div>';
  stage.appendChild(ov);
}

function totalPreguntas(e){ return e.preguntas.length + (e.candadoDespues?1:0); }

function pPregunta(){
  const e = EST[S.est], qs = preguntasDe(e), q = qs[S.q], t = tipoDe(e,q);
  const guardado = S.resp[q.codigo];
  const esCandado = S.q >= e.preguntas.length;
  let cuerpo = '';

  if(t === 'CODE'){
    cuerpo = '<input class="lockin" id="codigo" maxlength="20" autocomplete="off" placeholder="'
           + esc(q.placeholder||'') + '" value="' + esc(guardado||'') + '">';
  } else if(t === 'SORT'){
    if(!guardado) S.resp[q.codigo] = q.items.map(function(i){ return i.id; });
    cuerpo = '<div class="sort" id="cuerpo">' + filasSort(q) + '</div>';
  } else if(t === 'MULTI'){
    const sel = new Set(guardado||[]);
    cuerpo = '<div id="cuerpo">' + q.opciones.map(function(o,i){
      return '<button class="opt ' + (sel.has(i)?'sel':'') + '" data-multi="' + i + '">'
           + '<span class="box">' + (sel.has(i)?'&#10003;':'') + '</span>' + esc(o.texto) + '</button>';
    }).join('') + '</div><p style="font-size:14px;color:rgba(219,255,240,.6);margin-top:10px">'
      + 'Puede haber m&aacute;s de una correcta.</p>';
  } else if(t === 'TRUEFALSE'){
    cuerpo = '<div class="tf" id="cuerpo">'
      + [['true','VERDADERO'],['false','FALSO']].map(function(par){
          const on = guardado === (par[0]==='true');
          return '<button class="opt ' + (on?'sel':'') + '" data-tf="' + par[0] + '">'
               + '<span class="box">' + (on?'&#10003;':'') + '</span>' + par[1] + '</button>';
        }).join('') + '</div>';
  } else {
    cuerpo = '<div id="cuerpo">' + q.opciones.map(function(o,i){
      return '<button class="opt ' + (guardado===i?'sel':'') + '" data-single="' + i + '">'
           + '<span class="box">' + ('ABCD'[i]||(i+1)) + '</span>' + esc(o.texto) + '</button>';
    }).join('') + '</div>';
  }

  const cabecera = esCandado
    ? '<div class="kicker" style="margin-bottom:14px">' + esc(q.titulo||'CLAVE DE SALIDA') + '</div>'
    : '<div class="qnum">' + (S.q+1) + '/' + totalPreguntas(e) + '</div>';
  const pista = q.pista
    ? '<p style="font-size:14px;color:var(--amber);margin:-10px 0 18px">&#9656; ' + esc(q.pista) + '</p>'
    : '';
  const avance = (S.q < qs.length-1)
    ? '<button class="btn solid" data-a="despues">SIGUIENTE &rarr;</button>'
    : '<button class="btn solid" data-a="revisar">' + esc(T.revisar||'REVISAR RESPUESTAS') + ' &rarr;</button>';

  pinta('<div class="screen">' + fondoDe(e.fondo, true)
    + '<div class="layer">' + barra({reloj:true, atras:true}) + vitales()
    + '<div class="wrap"><div class="panel">'
    + cabecera
    + '<p class="qtext">' + esc(q.enunciado) + '</p>'
    + pista + cuerpo
    + '<div class="qfoot" style="justify-content:space-between">'
    + '<button class="btn ghost" data-a="antes" ' + (S.q===0?'disabled':'') + '>&larr; ANTERIOR</button>'
    + avance
    + '</div></div></div></div></div>');

  SFX.pulso();
  SFX.capa(restante() <= 60 ? 'tension' : 'sala');
  reanudarReloj();
  /* Llegar a la clave de salida es el momento fuerte de la estacion: se anuncia
     una sola vez, para que ir y volver entre preguntas no lo repita. */
  if(esCandado && !S.luzCandado[e.id]){
    S.luzCandado[e.id] = true; luz('sweep', 1500); SFX.abrir();
  }
  if(t === 'CODE'){
    const inp = document.getElementById('codigo');
    inp.addEventListener('input', function(){ S.resp[q.codigo] = inp.value.trim(); });
    setTimeout(function(){ inp.focus(); }, 60);
  }
}

function filasSort(q){
  const ids = S.resp[q.codigo];
  const texto = function(id){ const it = q.items.find(function(i){ return i.id===id; });
                              return it ? it.texto : ''; };
  return ids.map(function(id,i){
    return '<div class="srow"><div class="idx">' + (i+1) + '</div>'
         + '<div class="body">' + esc(texto(id)) + '</div><div class="arrows">'
         + '<button data-up="' + i + '" ' + (i===0?'disabled':'') + ' aria-label="Subir">&#9650;</button>'
         + '<button data-down="' + i + '" ' + (i===ids.length-1?'disabled':'') + ' aria-label="Bajar">&#9660;</button>'
         + '</div></div>';
  }).join('');
}

/* ---------- Revision antes de cerrar ---------- */
function textoDe(e,q,r){
  const t = tipoDe(e,q);
  if(r===undefined||r===null||r==='') return null;
  if(t==='CODE')      return r;
  if(t==='TRUEFALSE') return r ? 'Verdadero' : 'Falso';
  if(t==='SORT')      return r.map(function(id){
      const it = q.items.find(function(i){ return i.id===id; }); return it?it.texto:''; }).join('  \u2192  ');
  if(t==='MULTI')     return r.length ? r.slice().sort().map(function(i){ return q.opciones[i].texto; }).join('  \u00b7  ') : null;
  return q.opciones[r] ? q.opciones[r].texto : null;
}

function pRevision(){
  const e = EST[S.est], qs = preguntasDe(e);
  const faltan = qs.filter(function(q){ return textoDe(e,q,S.resp[q.codigo])===null; }).length;
  const filas = qs.map(function(q,i){
    const tx = textoDe(e,q,S.resp[q.codigo]);
    return '<button class="opt" data-a="ir-q" data-i="' + i + '" style="align-items:flex-start">'
         + '<span class="box">' + esc(q.codigo) + '</span>'
         + '<span style="flex:1;text-align:left">'
         + (tx ? esc(tx) : '<i style="opacity:.5">Sin responder</i>') + '</span>'
         + '<span style="font-size:12px;color:var(--green)">CAMBIAR</span></button>';
  }).join('');
  const aviso = faltan
    ? '<p style="color:var(--amber);font-size:14px;margin-top:14px">Quedan ' + faltan
      + ' sin responder. Esos puntos se pierden.</p>' : '';

  pinta('<div class="screen">' + fondoDe(e.fondo, true)
    + '<div class="layer">' + barra({reloj:true, atras:true}) + vitales()
    + '<div class="wrap"><div class="panel">'
    + '<div class="kicker" style="margin-bottom:6px">ANTES DE CERRAR LA ESTACI&Oacute;N</div>'
    + '<p style="font-size:15px;color:rgba(219,255,240,.75);margin-bottom:18px">'
    + 'Al validar se detiene el cron&oacute;metro y el registro es definitivo.</p>'
    + filas + aviso
    + '<div class="qfoot" style="justify-content:space-between">'
    + '<button class="btn ghost" data-a="ir-q" data-i="' + (qs.length-1) + '">&larr; VOLVER</button>'
    + '<button class="btn solid" id="cerrar" data-a="cerrar">&#10003; ' + esc(T.enviar) + '</button>'
    + '</div></div></div></div></div>');
  reanudarReloj();
}

/* ---------- Cierre: una sola validacion, como pide el insumo ---------- */
async function cerrarEstacion(){
  if(S.cerrando) return; S.cerrando = true;
  clearInterval(timerId); timerId = null;
  const e = EST[S.est];
  const b = document.getElementById('cerrar');
  if(b){ b.disabled = true; b.textContent = 'REGISTRANDO...'; }
  /* Sin tope inferior en el restante: si se pasaron de los 12 min esto supera
     los 720 s y el servidor deja la bonificacion en 0 y marca fuera de tiempo. */
  const usados = Math.max(0, segEstacion(e) - restante(e));
  let r;
  try{
    r = await rpc('evoforma2_cerrar', { p_partida:S.partida, p_estacion:e.id,
      p_respuestas:S.resp, p_seg_usados:usados });
  }catch(x){ S.cerrando=false; return pError(x.message); }
  S.puntos = r.puntos_total; S.aciertos += r.aciertos; S.hechas = r.estaciones_ok||[];
  S.cerrando = false;
  /* Si fallaron algo, se les dice a la cara antes del marcador. Enterarse
     leyendo una lista de palomitas y cruces no tiene la misma fuerza. */
  if(r.aciertos < r.preguntas) avisoIncorrecta(e, r);
  else pResultadoEstacion(e, r);
}

/* ---------- Alerta roja de respuesta incorrecta ----------
   Dice CUANTAS fallaron y si la que fallo fue la clave de salida, pero nunca
   cual era la correcta: esa informacion no sale del servidor, y es la
   propiedad que impide que el juego se resuelva mirando el navegador. */
let cierrePendiente = null;
function avisoIncorrecta(e, r){
  cierrePendiente = {e, r};
  const fallos = r.preguntas - r.aciertos;
  const cod = e.candadoDespues && e.candadoDespues.codigo;
  const claveMal = cod && (r.detalle||[]).some(function(d){
    return d.codigo === cod && !d.correcta; });

  SFX.fallo();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'incorrecta';
  ov.innerHTML = '<div class="mask"></div><div class="slash"></div><div class="vineta"></div>'
    + '<div class="ovbox">'
    + '<h2>RESPUESTA INCORRECTA</h2>'
    + '<div class="fallos">' + fallos + '</div>'
    + '<p>' + (fallos === 1 ? 'Una respuesta no era correcta.'
                            : 'Hay ' + fallos + ' respuestas que no eran correctas.') + '</p>'
    + (claveMal ? '<div class="cual">La <b>clave de salida</b> no abre este m&oacute;dulo.</div>' : '')
    + '<div class="row">'
    + '<button class="btn solid" data-a="verDetalle">VER QU&Eacute; FALL&Oacute;</button>'
    + '</div></div>';
  stage.appendChild(ov);
}

function pResultadoEstacion(e, r){
  /* Solo se celebra lo impecable: en tiempo y sin fallos. Si no, el marcador
     se muestra sin fanfarria — ya sono la alerta roja. */
  const impecable = !r.fuera_de_tiempo && r.aciertos === r.preguntas;
  SFX.capa('calma'); if(impecable) SFX.acierto();
  const detalle = r.detalle.map(function(d){
    return '<div class="opt ' + (d.correcta?'ok':'bad') + '" style="cursor:default">'
         + '<span class="box">' + (d.correcta?'&#10003;':'&#10007;') + '</span>'
         + '<span style="flex:1;text-align:left;font-size:15px">' + esc(d.titulo).slice(0,80) + '</span>'
         + '<span style="font-family:var(--disp)">' + d.puntos + '/' + d.puntos_max + '</span></div>';
  }).join('');

  pinta('<div class="screen">' + fondoDe(e.fondo, true)
    + '<div class="layer">' + barra({casa:false}) + vitales()
    + '<div class="wrap"><div class="panel">'
    + '<div class="kicker" style="text-align:center">' + esc(e.signoVital||'') + ' RECUPERADO</div>'
    + '<div style="text-align:center;margin:14px 0 6px">'
    + '<span style="font-family:var(--disp);font-size:64px;font-weight:900;color:var(--green)">'
    + r.puntos_estacion + '</span>'
    + '<span style="font-family:var(--disp);font-size:24px;color:rgba(219,255,240,.5)">/20</span></div>'
    + '<div class="kpis">'
    + '<div class="kpi"><b>' + r.puntos_preguntas + '</b><span>RESPUESTAS</span></div>'
    + '<div class="kpi"><b>+' + r.puntos_tiempo + '</b><span>BONO TIEMPO</span></div>'
    + '<div class="kpi"><b>' + mmss(r.seg_usados) + '</b><span>TIEMPO</span></div>'
    + '<div class="kpi"><b>' + r.aciertos + '/' + r.preguntas + '</b><span>ACIERTOS</span></div>'
    + '</div>'
    + '<p style="text-align:center;font-size:13px;color:rgba(219,255,240,.6);margin:6px 0 14px">'
    + esc(r.rango_tiempo) + '</p>' + detalle
    + '</div></div></div>'
    + '<div class="floatbtn"><button class="btn solid" data-a="trasEstacion">'
    + esc(T.siguiente) + ' &rarr;</button></div></div>');
  /* Aqui, DESPUES del pinta. Antes se creaba arriba y el repintado se lo comia. */
  luz(impecable ? ['flash','onda'] : ['slash','vineta'], 1200);
}

function trasEstacion(){
  if(S.hechas.length === EST.length) return pInforme();
  pMapa();
  luz('sweep', 1500);            /* el mapa acusa el signo vital recuperado */
}

async function pInforme(){
  let fin = null;
  try { fin = await rpc('evoforma2_finalizar', { p_partida: S.partida }); } catch(e){}
  const nQ = EST.reduce((a,e)=>a+e.preguntas.length+(e.candadoDespues?1:0),0);
  let rank = [];
  try { rank = await rpc('evoforma2_ranking', {}); } catch(e){}
  pinta(`<div class="screen">${fondoDe(GAME.hub.imagenMapa)}
    <div class="layer">${barra({casa:false})}
      <div class="wrap"><div class="panel">
        <div class="kicker" style="text-align:center">${esc(T.resultadosTitulo)}</div>
        <div class="kpis">
          <div class="kpi"><b>${S.puntos}</b><span>PUNTOS</span></div>
          <div class="kpi"><b>${S.aciertos}/${nQ}</b><span>ACIERTOS</span></div>
          <div class="kpi"><b>${S.intentos}</b><span>REINTENTOS</span></div>
          <div class="kpi"><b>${mmss(fin?fin.duracion_seg:0)}</b><span>TIEMPO</span></div>
        </div>
        <table><thead><tr><th>#</th><th>EQUIPO</th><th>PUNTOS</th><th>TIEMPO</th></tr></thead>
          <tbody>${rank.slice(0,6).map((r,i)=>
            `<tr><td>${i+1}</td><td>${esc(r.equipo)}</td><td>${r.puntos}</td>
             <td>${mmss(r.duracion_seg)}</td></tr>`).join('')}</tbody></table>
        <p style="text-align:center;margin-top:16px;font-size:15px">${esc(GAME.cierre)}</p>
      </div></div></div>
    <div class="floatbtn"><button class="btn solid" data-a="gracias">${esc(T.finalizar)}</button></div></div>`);
  /* Cierre del juego: el barrido entra despues del destello, no encima. */
  SFX.acierto(); luz(['flash','onda'], 1200);
  setTimeout(function(){ luz('sweep', 1500); }, 420);
}
function pGracias(){
  pinta(`<div class="screen">${fondoDe(GAME.imagenPortada)}
    <div class="layer"><div class="center">
      <div class="titlebox"><h1 style="font-size:40px">${esc(GAME.agradecimiento)}</h1></div>
      <button class="btn" data-a="reiniciar">VOLVER A EMPEZAR ↻</button>
    </div></div></div>`);
}
function confirmarSalida(){
  const ov=document.createElement('div'); ov.className='ov'; ov.id='salida';
  ov.innerHTML=`<div class="mask"></div><div class="ovbox">
    <h2>${esc(T.salirTitulo)}</h2><p>${esc(T.salirTexto)}</p>
    <div class="row"><button class="btn ghost" data-a="cerrarOv">${esc(T.salirCancelar)}</button>
    <button class="btn solid" data-a="reiniciar">${esc(T.salirConfirmar)}</button></div></div>`;
  stage.appendChild(ov);
}

/* ---------------- Eventos ---------------- */
let sonidoAuto = false;
/** El boton lleva icono Y etiqueta: repintarlo entero, no solo el emoji. */
function pintarBotonSonido(b){
  b.classList.toggle('on', SFX.activo);
  b.title = SFX.activo ? 'Silenciar' : 'Activar sonido';
  b.innerHTML = '<span>' + (SFX.activo?'🔊':'🔇') + '</span>'
              + (SFX.activo?'SONIDO':'SIN SONIDO');
}

stage.addEventListener('click', async ev=>{
  const t = ev.target.closest('[data-a],[data-single],[data-multi],[data-tf],[data-up],[data-down]');
  if(!t) return;

  /* El navegador no deja sonar hasta que hay un gesto del usuario. Aprovechamos
     el PRIMERO que llegue, sea cual sea: si el sonido depende de que alguien
     encuentre el boton, la sala se queda en silencio. Solo una vez; a partir de
     ahi manda el boton. */
  if(!sonidoAuto){
    sonidoAuto = true;
    if(!SFX.activo && t.dataset.a !== 'sonido'){
      SFX.alternar();
      document.querySelectorAll('[data-a="sonido"]').forEach(pintarBotonSonido);
    }
  }

  const qActual = () => preguntasDe(EST[S.est])[S.q];
  if(t.dataset.up !== undefined || t.dataset.down !== undefined){
    const q = qActual(), ids = S.resp[q.codigo];
    const i = +(t.dataset.up ?? t.dataset.down), j = t.dataset.up!==undefined ? i-1 : i+1;
    [ids[i],ids[j]] = [ids[j],ids[i]];
    document.getElementById('cuerpo').innerHTML = filasSort(q); SFX.clic(); return;
  }
  if(t.dataset.multi !== undefined){
    const q = qActual(), i = +t.dataset.multi;
    const cur = new Set(S.resp[q.codigo]||[]);
    if(cur.has(i)){ cur.delete(i); t.classList.remove('sel'); t.querySelector('.box').textContent=''; }
    else { cur.add(i); t.classList.add('sel'); t.querySelector('.box').textContent='\u2713'; }
    S.resp[q.codigo] = [...cur]; SFX.clic(); return; }
  if(t.dataset.tf !== undefined){
    S.resp[qActual().codigo] = t.dataset.tf==='true';
    document.querySelectorAll('[data-tf]').forEach(b=>{b.classList.remove('sel');b.querySelector('.box').textContent='';});
    t.classList.add('sel'); t.querySelector('.box').textContent='\u2713'; SFX.clic(); return; }
  if(t.dataset.single !== undefined){
    const sel = +t.dataset.single;
    S.resp[qActual().codigo] = sel;
    document.querySelectorAll('[data-single]').forEach((b,i)=>{ b.classList.toggle('sel', i===sel);
      b.querySelector('.box').textContent='ABCD'[i]||i+1; });
    SFX.clic(); return; }

  switch(t.dataset.a){
    case 'registro':     pRegistro(); break;
    case 'entrar':       await entrar(); break;
    case 'mapa':         clearInterval(timerId); timerId=null;
                         document.getElementById('alarm')?.remove(); pMapa(); break;
    case 'estacion':     S.est=+t.dataset.i; S.q=0; S.resp={}; pBriefing(); break;
    case 'empezar':      S.estT0=Date.now(); SFX.entrar();
                         arrancarReloj(EST[S.est]); pPregunta();
                         luz('sweep', 1500); break;   /* se abre la sala */
    case 'antes':        if(S.q>0){ S.q--; pPregunta(); } break;
    case 'despues':      S.q++; pPregunta(); break;
    case 'ir-q':         document.getElementById('alarm')?.remove();
                         S.q = +t.dataset.i; pPregunta(); break;
    case 'revisar':      document.getElementById('alarm')?.remove(); pRevision(); break;
    case 'cerrar':       await cerrarEstacion(); break;
    case 'verDetalle':   document.getElementById('incorrecta')?.remove();
                         if(cierrePendiente){ pResultadoEstacion(cierrePendiente.e, cierrePendiente.r);
                                              cierrePendiente = null; } break;
    case 'trasEstacion': trasEstacion(); break;
    case 'informe':      await pInforme(); break;
    case 'gracias':      pGracias(); break;
    case 'salir':        confirmarSalida(); break;
    case 'cerrarOv':     document.getElementById('salida')?.remove(); break;
    case 'reiniciar':    reset(); pPortada(); break;
    case 'sonido':       SFX.alternar(); pintarBotonSonido(t); break;
  }
});
addEventListener('keydown', async e=>{
  const cod = document.getElementById('codigo');
  if(e.key==='Enter' && cod && document.activeElement===cod){
    document.querySelector('[data-a="revisar"],[data-a="despues"]')?.click(); return; }
  const eq = document.getElementById('equipo');
  if(e.key==='Enter' && eq && document.activeElement===eq){ await entrar(); return; }
  if(cod || eq) return;
  if(e.key.toLowerCase()==='f') document.documentElement.requestFullscreen?.().catch(()=>{});
  if(e.key.toLowerCase()==='r'){ reset(); pPortada(); }
});

async function entrar(){
  const nombre = document.getElementById('equipo').value.trim();
  const err = document.getElementById('regerr');
  if(!nombre){ err.textContent='Escriban el nombre del equipo.'; return; }
  pCargando('Registrando tripulación…');
  try{
    const r = await rpc('evoforma2_iniciar', { p_equipo:nombre,
      p_jornada: document.getElementById('jornada')?.value.trim() || null });
    S.partida=r.partida_id; S.equipo=r.equipo; S.puntos=r.puntos;
    S.aciertos=r.aciertos; S.intentos=r.intentos; S.hechas=r.estaciones_ok||[];
    S.hechas.length ? pMapa() : pIntro();
  } catch(x){ pError(x.message); }
}

/* ---------------- Arranque ---------------- */
(async ()=>{
  reset(); ajustar(); pCargando('Conectando con la torre de control…');
  try{
    const cfg = await rpc('evoforma2_config', {});
    if(!cfg) throw new Error('El juego no está configurado en el servidor.');
    GAME = cfg.juego; T = cfg.textos; EST = cfg.estaciones;
    pPortada();
  } catch(e){ pError(e.message); }
})();
</script>
