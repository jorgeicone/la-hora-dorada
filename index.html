<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>La Hora Dorada · Escape Room de Trauma | Solventum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta oficial Solventum, en su registro oscuro: quirófano de noche */
  --green:#05DD4D; --deep:#01332B; --abyss:#04201B; --teal:#0A7B6B;
  --mint:#DBFFF0;  --mint2:#BFFDE3; --ink:#E9F7F0;
  --panel:rgba(1,51,43,.74); --panel2:rgba(255,255,255,.05);
  --border:rgba(5,221,77,.32); --border-soft:rgba(219,255,240,.16);
  --alarm:#FF5A4E; --amber:#FFB020;
  --r:14px; --pill:80px;
  --display:'Solve Pro','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--display); color:var(--ink); line-height:1.55;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(5,221,77,.12), transparent 60%),
    radial-gradient(90% 70% at 100% 100%, rgba(10,123,107,.20), transparent 60%),
    linear-gradient(175deg,#04201B 0%,#01332B 55%,#04201B 100%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}

.wrap{width:min(1040px,100%);margin:0 auto;padding:0 20px}
.screen{display:none;animation:in .3s ease both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- Barra superior ---------------- */
.top{position:sticky;top:0;z-index:30;background:rgba(4,32,27,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft)}
.top-in{width:min(1040px,100%);margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo svg{height:24px;width:auto;display:block}
.logo .sep{width:1px;height:22px;background:var(--border-soft)}
.logo .t{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--green);font-weight:800;white-space:nowrap;line-height:1.3}
.logo .t small{display:block;letter-spacing:.03em;text-transform:none;
  color:var(--mint2);opacity:.6;font-weight:500;font-size:.72rem}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pts{font-family:var(--mono);font-size:.82rem;font-weight:800;color:var(--mint2);
  border:1px solid var(--border-soft);border-radius:var(--pill);padding:7px 15px;white-space:nowrap}
.clock{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.3);
  border:1px solid var(--border);border-radius:var(--pill);padding:6px 18px}
.clock .l{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mint2);opacity:.7;font-weight:800}
.clock .v{font-family:var(--mono);font-size:1.4rem;font-weight:800;color:var(--green);
  line-height:1.1;font-variant-numeric:tabular-nums}
.clock.warn{border-color:rgba(255,176,32,.6)} .clock.warn .v{color:var(--amber)}
.clock.crit{border-color:rgba(255,90,78,.7);background:rgba(255,90,78,.1)}
.clock.crit .v{color:var(--alarm);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
@media(max-width:860px){ .top-r{margin-left:0;width:100%} .clock{flex:1;justify-content:space-between} }

/* ---------------- Tipografía ---------------- */
h1{font-size:clamp(1.9rem,5.5vw,3.2rem);font-weight:900;letter-spacing:-.03em;line-height:1.05}
h2{font-size:clamp(1.3rem,3.4vw,1.9rem);font-weight:900;letter-spacing:-.02em;line-height:1.15}
h3{font-size:1.02rem;font-weight:800}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--green);font-weight:800}
.lead{color:var(--mint2);opacity:.9;font-size:1.02rem;max-width:62ch}
.muted{color:var(--mint2);opacity:.55;font-size:.85rem}

/* ---------------- Botones ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 32px;border-radius:var(--pill);font-weight:800;font-size:1rem;transition:.15s}
.btn.primary{background:var(--green);color:var(--abyss)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border:1.5px solid var(--border);color:var(--mint)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{border:1.5px solid rgba(255,90,78,.6);color:#FFB4AE}
.btn.danger:hover{background:rgba(255,90,78,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.xl{padding:19px 38px;font-size:1.06rem}
.btn.block{width:100%}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--border-soft);color:var(--mint2);font-size:1.05rem}
.icon:hover{border-color:var(--green);color:var(--green)}

/* ---------------- Paneles ---------------- */
.panel{background:var(--panel);border:1px solid var(--border-soft);
  border-radius:18px;padding:28px;backdrop-filter:blur(4px)}
.panel + .panel{margin-top:16px}
.hero{padding:56px 0 34px}
.center{text-align:center}

/* ---------------- Monitor (hub) ---------------- */
.monitor{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
@media(max-width:760px){.monitor{grid-template-columns:1fr}}
.lead-card{position:relative;overflow:hidden;text-align:left;width:100%;
  background:var(--panel);border:1.5px solid var(--border-soft);border-radius:18px;
  padding:22px 24px;transition:.18s}
.lead-card .vital{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mint2);opacity:.6;font-weight:800}
.lead-card h3{margin:6px 0 4px;color:var(--ink)}
.lead-card p{font-size:.87rem;color:var(--mint2);opacity:.75}
.lead-card .ecg{height:46px;margin-top:14px;display:block;width:100%}
.lead-card .ecg polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
/* bloqueada: línea plana y apagada */
.lead-card.locked{opacity:.45}
.lead-card.locked .ecg polyline{stroke:rgba(219,255,240,.3)}
/* disponible: latido vivo en verde */
.lead-card.avail{cursor:pointer;border-color:var(--green);box-shadow:0 0 34px rgba(5,221,77,.16)}
.lead-card.avail:hover{background:rgba(5,221,77,.07);transform:translateY(-2px)}
/* Late siempre visible: una animación que dibuja el trazo desde cero deja la
   tarjeta vacía durante parte del ciclo y parece un fallo de carga. */
.lead-card.avail .ecg polyline{stroke:var(--green);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{
  0%,100%{opacity:.6}
  50%{opacity:1;filter:drop-shadow(0 0 7px rgba(5,221,77,.8))}
}
/* recuperada: trazo estable */
.lead-card.done{border-color:rgba(5,221,77,.5);background:rgba(5,221,77,.07)}
.lead-card.done .ecg polyline{stroke:var(--green);opacity:.85}
.lead-card .badge{position:absolute;top:18px;right:20px;font-size:.62rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:var(--pill)}
.lead-card.done .badge{background:rgba(5,221,77,.18);color:var(--green)}
.lead-card.locked .badge{background:rgba(219,255,240,.1);color:var(--mint2)}
.lead-card.avail .badge{background:var(--green);color:var(--abyss)}

.core{margin-top:16px;text-align:center;padding:30px;border-radius:18px;
  border:1.5px dashed var(--border-soft);background:var(--panel)}
.core.on{border-style:solid;border-color:var(--green);cursor:pointer;
  background:rgba(5,221,77,.09);box-shadow:0 0 44px rgba(5,221,77,.2)}
.core .n{font-family:var(--mono);font-size:1.6rem;font-weight:800;color:var(--green)}

/* ---------------- Retos ---------------- */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--mono);font-size:.7rem;font-weight:800;background:rgba(5,221,77,.15);
  color:var(--green);padding:3px 10px;border-radius:var(--pill)}
.qhead .pts-q{margin-left:auto;font-size:.68rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mint2);opacity:.6}
.qtext{font-size:1.12rem;font-weight:700;line-height:1.4;margin-bottom:20px}

.opts{display:grid;gap:11px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;text-align:left;
  padding:15px 18px;border:1.5px solid var(--border-soft);border-radius:var(--r);
  background:rgba(0,0,0,.22);transition:.15s;width:100%}
.opt:hover{border-color:var(--teal);background:rgba(255,255,255,.05)}
.opt .box{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:var(--mint2);font-family:var(--mono);
  font-weight:800;font-size:.82rem;transition:.15s}
.opt .tx{font-size:.97rem;padding-top:3px}
.opt.sel{border-color:var(--green);background:rgba(5,221,77,.1)}
.opt.sel .box{background:var(--green);color:var(--abyss)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;grid-template-columns:auto auto}

/* Ordenar: botones ▲▼, nunca arrastrar (impreciso en táctil y sin teclado) */
.sort{display:grid;gap:11px}
.srow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;
  padding:13px 16px;border:1.5px solid var(--border-soft);border-radius:var(--r);
  background:rgba(0,0,0,.22)}
.srow .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(5,221,77,.14);color:var(--green);font-family:var(--mono);font-weight:800;font-size:.86rem}
.srow .tx{font-size:.95rem}
.arrows{display:flex;flex-direction:column;gap:4px}
.arrows button{width:38px;height:26px;border-radius:6px;border:1px solid var(--border-soft);
  color:var(--mint2);font-size:.72rem;line-height:1}
.arrows button:hover:not(:disabled){background:var(--green);color:var(--abyss);border-color:var(--green)}
.arrows button:disabled{opacity:.25;cursor:not-allowed}

.nav{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.nav .btn{flex:1;min-width:150px}
.steps{display:flex;gap:7px;margin:20px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:34px;height:5px;border-radius:var(--pill);background:rgba(255,255,255,.12)}
.step.done{background:var(--green)}
.step.now{background:var(--mint2)}

/* ---------------- Revisión ---------------- */
.rev{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rev-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:14px 18px;border-radius:var(--r);background:rgba(0,0,0,.22);
  border-left:3px solid var(--border-soft)}
.rev-row.full{border-left-color:var(--green)}
.rev-row .k{font-family:var(--mono);font-size:.78rem;font-weight:800;color:var(--green)}
.rev-row .v{font-size:.9rem;color:var(--mint2)}
.rev-row .v em{opacity:.5;font-style:normal}
.rev-row .go{font-size:.76rem;font-weight:800;color:var(--teal)}

/* ---------------- Resultado ---------------- */
.big{font-family:var(--mono);font-size:clamp(3.4rem,15vw,6rem);font-weight:800;
  line-height:1;color:var(--green);text-shadow:0 0 60px rgba(5,221,77,.3)}
.big .max{font-size:.32em;color:var(--mint2);opacity:.5;text-shadow:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:24px}
.kpi{background:rgba(0,0,0,.24);border-radius:var(--r);padding:16px;text-align:center}
.kpi b{display:block;font-family:var(--mono);font-size:1.6rem;font-weight:800;color:var(--ink)}
.kpi span{font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mint2);opacity:.6;font-weight:800}
.det{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.det-row{display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:var(--r);
  background:rgba(0,0,0,.22);border-left:3px solid var(--border-soft)}
.det-row.ok{border-left-color:var(--green);background:rgba(5,221,77,.07)}
.det-row.no{border-left-color:var(--alarm);background:rgba(255,90,78,.08)}
.det-row .i{font-weight:900;width:22px;text-align:center}
.det-row.ok .i{color:var(--green)} .det-row.no .i{color:var(--alarm)}
.det-row .t{flex:1;min-width:0}
.det-row .t b{display:block;font-size:.88rem}
.det-row .t span{font-size:.83rem;color:var(--mint2);opacity:.7;display:block;margin-top:2px}
.det-row .p{font-family:var(--mono);font-weight:800;white-space:nowrap}
.det-row.ok .p{color:var(--green)} .det-row.no .p{color:var(--alarm)}

table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-soft)}
th{font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mint2);opacity:.6;font-weight:800}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}

/* ---------------- Overlays ---------------- */
.ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:22px;
  background:rgba(2,14,11,.86);backdrop-filter:blur(6px)}
.ov.on{display:grid}
.ovbox{width:min(500px,100%);background:#062B23;border:1px solid var(--border);
  border-radius:18px;padding:34px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.ovbox h2{margin-bottom:10px}
.ovbox p{color:var(--mint2);opacity:.85;font-size:.95rem}
.ovbox .row{display:flex;gap:12px;margin-top:26px}
.ovbox .row .btn{flex:1;padding:14px 18px;font-size:.95rem}
#alarm .ovbox{border-color:rgba(255,90,78,.6);background:#3A0F0C}
#alarm h2{color:#FFB4AE}
.slash{position:fixed;inset:0;z-index:59;pointer-events:none;display:none;
  background:repeating-linear-gradient(115deg,rgba(255,90,78,.3) 0 80px,transparent 80px 200px);
  animation:sweep .7s ease-out}
.slash.on{display:block}
@keyframes sweep{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}

footer.pie{text-align:center;padding:36px 20px 30px;color:var(--mint2);opacity:.45;font-size:.76rem}
</style>
</head>
<body>

<script>
'use strict';

/* =========================================================================
   CONTENIDO — inyectado desde contenido-solventum.json por construir.py.
   No editar aquí: se pierde al regenerar.
   ========================================================================= */
const GAME = {
  "juego": {
    "titulo": "LA HORA DORADA",
    "subtitulo": "Escape Room de Trauma",
    "botonInicio": "INICIAR MISIÓN",
    "coleccionable": {
      "nombre": "Signo Vital",
      "plural": "Signos Vitales",
      "cantidad": 4,

const T   = GAME.textos;
const EST = GAME.estaciones;
const BON = GAME.bonosTiempo;

/* -------------------------------------------------------------------------
   LÓGICA
   Input   : el equipo recorre estaciones y responde sus preguntas.
   Proceso : una estación = varias preguntas + un candado de salida. Se valida
             TODO de una sola vez al cerrar la estación (regla del cliente),
             se cronometra la estación completa y se aplica bono por tramos.
   Output  : signos vitales recuperados, puntaje por estación e informe final.
   Estados : cover · intro · hub · briefing · pregunta · revision · resultado
             · informe · cierre.  Overlays: alarma (tiempo agotado) y salida.
   ------------------------------------------------------------------------- */

let S;
function reset(){
  S = {
    pantalla:'cover', est:0, q:0,
    resueltas:[],                 // índices de estaciones cerradas
    respuestas:{},                // { "E1": { "1.1": <respuesta>, ... } }
    resultados:{},                // { "E1": { puntos, detalle, ... } }
    t0:Date.now(), estT0:0, tick:null
  };
}

const app  = document.getElementById('app');
const topR = document.getElementById('topR');
const esc  = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = s => { s=Math.max(0,Math.round(s));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

/** Todas las preguntas de una estación, con el candado al final. */
function preguntasDe(e){ return e.candadoDespues ? e.preguntas.concat([e.candadoDespues]) : e.preguntas.slice(); }
function tipoDe(e,q){ return q.tipoReto || e.tipoReto; }
function puntosMaxDe(e){
  return preguntasDe(e).reduce((a,q)=>a+q.puntos,0) + Math.max(...BON.map(b=>b.puntos));
}
function puntosTotales(){ return Object.values(S.resultados).reduce((a,r)=>a+r.puntos,0); }

/* =========================================================================
   CORRECCIÓN  ← ÚNICO PUNTO A MOVER AL SERVIDOR EN PRODUCCIÓN
   Hoy compara contra el contenido incrustado. En producción esta función
   se reemplaza por una llamada RPC que devuelve el detalle ya calculado,
   y el contenido deja de incluir 'correcta'.
   ========================================================================= */
function evaluar(e, q, r){
  const t = tipoDe(e,q);
  if (r === undefined || r === null) return false;
  if (t === 'SORT')      return Array.isArray(r) && r.every((it,i)=>it.orden===i);
  if (t === 'TRUEFALSE') return r === q.respuesta;
  if (t === 'MULTI'){
    const need = new Set(q.opciones.map((o,i)=>o.correcta?i:-1).filter(i=>i>=0));
    const got  = new Set(r);
    return got.size===need.size && [...need].every(i=>got.has(i));
  }
  return typeof r === 'number' && !!(q.opciones[r] && q.opciones[r].correcta);
}
/** Texto legible de lo que respondió el equipo, para el informe. */
function textoRespuesta(e,q,r){
  const t = tipoDe(e,q);
  if (r === undefined || r === null) return null;
  if (t === 'SORT')      return r.map(i=>i.texto).join('  →  ');
  if (t === 'TRUEFALSE') return r ? 'Verdadero' : 'Falso';
  if (t === 'MULTI')     return [...r].sort().map(i=>q.opciones[i].texto).join('  ·  ');
  return q.opciones[r] ? q.opciones[r].texto : null;
}

/* =========================================================================
   CRONÓMETRO DE ESTACIÓN
   ========================================================================= */
function pararReloj(){ if(S.tick){clearInterval(S.tick);S.tick=null;} }
function arrancarReloj(){ pararReloj(); S.estT0 = Date.now(); S.tick = setInterval(latido,250); latido(); }
function transcurrido(){ return (Date.now()-S.estT0)/1000; }

function latido(){
  const e = EST[S.est], max = e.tiempoMaxSeg, resta = max - transcurrido();
  const c = document.getElementById('clk');
  if(!c) return;
  c.className = 'clock' + (resta<=60?' crit':resta<=240?' warn':'');
  c.querySelector('.v').textContent = mmss(Math.max(0,resta));
  const b = BON.find(x=>transcurrido()<=x.hasta_seg);
  const n = c.querySelector('.b'); if(n) n.textContent = b?`+${b.puntos} si cierras ya`:'Sin bonificación';
  if(resta<=0){ pararReloj(); alarma(); }
}
function bonoActual(seg){ return BON.find(b=>seg<=b.hasta_seg) || null; }

   BARRA SUPERIOR
   ========================================================================= */
function pintarTop(){
  const enEstacion = ['briefing','pregunta','revision'].includes(S.pantalla);
  topR.innerHTML =
    (GAME.config.mostrarPuntuacion && S.pantalla!=='cover'
      ? `<div class="pts">${puntosTotales()} PTS</div>` : '') +
    (enEstacion && S.pantalla!=='briefing'
      ? `<div class="clock" id="clk"><div><div class="l">Tiempo restante</div><div class="v">--:--</div></div><div class="b" style="font-size:.72rem;font-weight:700;color:var(--mint)"></div></div>` : '') +
    (S.pantalla!=='cover' ? `<button class="icon" data-a="salir" title="Salir">✕</button>` : '');
}

        ? '0,23 300,23'
        : '0,23 40,23 52,23 58,8 64,38 70,20 78,23 120,23 132,23 138,6 144,40 150,20 158,23 210,23 222,23 228,9 234,37 240,20 248,23 300,23';
      return `<button class="lead-card ${st}" ${st==='avail'?`data-a="est" data-i="${i}"`:'disabled'}>
        <span class="badge">${et}</span>
        <div class="vital">${e.signoVital?esc(e.signoVital):'Estación'}</div>
        <h3>${esc(e.nombre)}</h3>
        <p>${esc(e.descripcionMapa)}</p>
        <svg class="ecg" viewBox="0 0 300 46" preserveAspectRatio="none" aria-hidden="true">
          <polyline points="${linea}"/></svg>
      </button>`;
    }).join('');
    const coreOn = central>=0 && !S.resueltas.includes(central) &&
                   externas.every((_,i)=>S.resueltas.includes(i));
    const coreHecho = central>=0 && S.resueltas.includes(central);
    app.innerHTML = `<div class="screen on"><div class="wrap hero" style="padding-top:34px">
      <div class="eyebrow">${esc(GAME.juego.hub.titulo)}</div>
      <h2 style="margin-top:10px">${S.resueltas.filter(i=>!EST[i].esCentral).length} de ${externas.length} ${esc(GAME.juego.coleccionable.plural.toLowerCase())} recuperados</h2>
      <p class="muted" style="margin-top:8px">${esc(GAME.juego.hub.instruccion)}</p>
      <div class="monitor">${cards}</div>
      ${central>=0?`<div class="core ${coreOn?'on':''}" ${coreOn?`data-a="est" data-i="${central}"`:''}>
        <div class="n">${coreHecho?'✓':coreOn?'ACCEDER':S.resueltas.length+' / '+externas.length}</div>
        <h3 style="margin-top:8px">${esc(EST[central].nombre)}</h3>
        <p class="muted" style="margin-top:4px">${esc(EST[central].descripcionMapa)}</p>
      </div>`:''}
      ${EST.every((_,i)=>S.resueltas.includes(i))?
        `<div class="nav"><button class="btn primary xl block" data-a="informe">Ver informe de misión →</button></div>`:''}
    </div></div>`;
  },

  briefing(){
    const e = EST[S.est];
    app.innerHTML = `<div class="screen on"><div class="wrap hero">
      <div class="eyebrow">${e.signoVital?esc(e.signoVital):'Estación final'}</div>
      <h1 style="margin:12px 0 6px;font-size:clamp(1.6rem,4.4vw,2.4rem)">${esc(e.nombre)}</h1>
      <div class="panel" style="margin-top:20px">
        <p style="font-size:1.02rem;line-height:1.65">${esc(e.briefing)}</p>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:12px">Cómo se puntúa esta estación</h3>
        <div class="tw"><table>
          <thead><tr><th>Concepto</th><th>Puntos</th></tr></thead><tbody>
          ${preguntasDe(e).map(q=>`<tr><td>${esc(q.codigo)} · ${esc((q.enunciado||q.titulo||'').slice(0,58))}…</td><td class="n">${q.puntos}</td></tr>`).join('')}
          <tr><td>Bonificación por tiempo (máx.)</td><td class="n">+${Math.max(...BON.map(b=>b.puntos))}</td></tr>
          </tbody></table></div>
        <p class="muted" style="margin-top:12px">Tiempo máximo ${mmss(e.tiempoMaxSeg)}. El cronómetro
        arranca al pulsar el botón y se detiene cuando cierren la estación.</p>
      </div>
      <div class="nav">
        <button class="btn ghost" data-a="hub">← Volver al monitor</button>
        <button class="btn primary" data-a="empezar">Entrar y arrancar cronómetro →</button>
      </div>
    </div></div>`;
  },

  pregunta(){
    const e = EST[S.est], qs = preguntasDe(e), q = qs[S.q];
    const t = tipoDe(e,q), prev = (S.respuestas[e.id]||{})[q.codigo];
    let cuerpo = '';

    if (t === 'SORT'){
      const orden = prev || barajar(q.items);
      (S.respuestas[e.id] = S.respuestas[e.id]||{})[q.codigo] = orden;
      cuerpo = `<div class="sort" id="sort">${filasSort(orden)}</div>`;
    } else if (t === 'TRUEFALSE'){
      cuerpo = `<div class="tf">
        ${[['true','Verdadero'],['false','Falso']].map(([v,l])=>
          `<button class="opt ${prev===(v==='true')?'sel':''}" data-tf="${v}">
             <span class="box">${prev===(v==='true')?'✓':''}</span><span class="tx">${l}</span></button>`).join('')}
      </div>`;
    } else if (t === 'MULTI'){
      const sel = new Set(prev||[]);
      cuerpo = `<div class="opts">${q.opciones.map((o,i)=>
        `<button class="opt ${sel.has(i)?'sel':''}" data-multi="${i}">
           <span class="box">${sel.has(i)?'✓':''}</span><span class="tx">${esc(o.texto)}</span></button>`).join('')}</div>
        <p class="muted" style="margin-top:12px">Puede haber más de una correcta.</p>`;
    } else {
      cuerpo = `<div class="opts">${q.opciones.map((o,i)=>
        `<button class="opt ${prev===i?'sel':''}" data-single="${i}">
           <span class="box">${'ABCD'[i]||i+1}</span><span class="tx">${esc(o.texto)}</span></button>`).join('')}</div>`;
    }

    app.innerHTML = `<div class="screen on"><div class="wrap" style="padding-top:26px">
      <div class="steps">${qs.map((_,i)=>
        `<div class="step ${i<S.q?'done':i===S.q?'now':''}"></div>`).join('')}</div>
      <div class="panel">
        <div class="qhead">
          <span class="tag">${esc(q.codigo)}</span>
          <span class="muted">${S.q+1} de ${qs.length}</span>
          <span class="pts-q">${q.puntos} ${q.puntos===1?'punto':'puntos'}</span>
        </div>
        ${q.titulo?`<h3 style="margin-bottom:8px">${esc(q.titulo)}</h3>`:''}
        <p class="qtext">${esc(q.enunciado)}</p>
        ${cuerpo}
      </div>
      <div class="nav">
        <button class="btn ghost" data-a="antes" ${S.q===0?'disabled':''}>← Anterior</button>
        ${S.q<qs.length-1
          ? `<button class="btn primary" data-a="despues">Siguiente →</button>`
          : `<button class="btn primary" data-a="revisar">Revisar respuestas →</button>`}
      </div>
    </div></div>`;
    if(!S.tick) arrancarReloj(); else latido();
  },

  revision(){
    const e = EST[S.est], qs = preguntasDe(e), R = S.respuestas[e.id]||{};
    const faltan = qs.filter(q=>R[q.codigo]===undefined || (Array.isArray(R[q.codigo]) && !R[q.codigo].length)).length;
    app.innerHTML = `<div class="screen on"><div class="wrap" style="padding-top:26px">
      <div class="eyebrow">Antes de cerrar</div>
      <h2 style="margin:10px 0 6px">Revisen sus respuestas</h2>
      <p class="muted">Al validar se detiene el cronómetro y el registro es definitivo.</p>
      <div class="rev">${qs.map((q,i)=>{
        const txt = textoRespuesta(e,q,R[q.codigo]);
        return `<button class="rev-row ${txt?'full':''}" data-a="ir-q" data-i="${i}">
          <span class="k">${esc(q.codigo)}</span>
          <span class="v">${txt?esc(txt):'<em>Sin responder</em>'}</span>
          <span class="go">Cambiar</span></button>`;}).join('')}</div>
      ${faltan?`<p class="muted" style="margin-top:16px;color:var(--amber)">
        Quedan ${faltan} sin responder. Esos puntos se pierden.</p>`:''}
      <div class="nav">
        <button class="btn ghost" data-a="ir-q" data-i="${qs.length-1}">← Volver</button>
        <button class="btn primary" data-a="cerrar">✓ ${esc(T.enviar)}</button>
      </div>
    </div></div>`;
  },

  resultado(){
    const e = EST[S.est], r = S.resultados[e.id];
    app.innerHTML = `<div class="screen on"><div class="wrap hero">
      <div class="center">
        <div class="eyebrow">${e.signoVital?esc(e.signoVital)+' recuperado':'Estación cerrada'}</div>
        <h2 style="margin:10px 0 20px">${esc(e.nombre)}</h2>
        <div class="big">${r.puntos}<span class="max">/${puntosMaxDe(e)}</span></div>
      </div>
      <div class="kpis">
        <div class="kpi"><b>${r.puntosPreg}</b><span>Por respuestas</span></div>
        <div class="kpi"><b>+${r.puntosTiempo}</b><span>Bono tiempo</span></div>
        <div class="kpi"><b>${mmss(r.seg)}</b><span>Tiempo</span></div>
        <div class="kpi"><b>${r.aciertos}/${r.detalle.length}</b><span>Aciertos</span></div>
      </div>
      <div class="panel" style="margin-top:18px">
        <h3 style="margin-bottom:14px">Detalle</h3>
        <div class="det">${r.detalle.map(d=>`
          <div class="det-row ${d.ok?'ok':'no'}">
            <div class="i">${d.ok?'✔':'✕'}</div>
            <div class="t"><b>${esc(d.codigo)}</b><span>${d.txt?esc(d.txt):'Sin responder'}</span></div>
            <div class="p">${d.puntos}/${d.max}</div>
          </div>`).join('')}</div>
      </div>
      <div class="panel center"><p style="font-size:1rem">${esc(e.mensajeExito)}</p></div>
      <div class="nav"><button class="btn primary xl block" data-a="hub">${esc(T.volverAlMapa)} →</button></div>
    </div></div>`;
  },

  informe(){
    const seg = Math.round((Date.now()-S.t0)/1000);
    const maxTot = EST.reduce((a,e)=>a+puntosMaxDe(e),0);
    const filas = EST.map(e=>{ const r=S.resultados[e.id]; return `<tr>
      <td>${esc(e.nombre)}</td>
      <td class="n">${r?r.aciertos+'/'+r.detalle.length:'—'}</td>
      <td class="n">${r?r.puntosPreg:'—'}</td>
      <td class="n">${r?'+'+r.puntosTiempo:'—'}</td>
      <td class="n">${r?mmss(r.seg):'—'}</td>
      <td class="n" style="color:var(--green);font-weight:800">${r?r.puntos:'—'}</td></tr>`;}).join('');
    app.innerHTML = `<div class="screen on"><div class="wrap hero">
      <div class="center">
        <div class="eyebrow">${esc(T.resultadosTitulo)}</div>
        <div class="big" style="margin-top:16px">${puntosTotales()}<span class="max">/${maxTot}</span></div>
        <p class="muted" style="margin-top:8px">Tiempo total de misión ${mmss(seg)}</p>
      </div>
      <div class="panel" style="margin-top:24px">
        <div class="tw"><table>
          <thead><tr><th>Estación</th><th>Aciertos</th><th>Respuestas</th><th>Tiempo</th><th>Duración</th><th>Total</th></tr></thead>
          <tbody>${filas}</tbody></table></div>
      </div>
      <div class="panel center"><p style="font-size:1.02rem">${esc(GAME.juego.cierre)}</p></div>
      <div class="nav">
        <button class="btn ghost" data-a="csv">↓ Exportar CSV</button>
        <button class="btn primary" data-a="cierre">${esc(T.finalizar)} →</button>
      </div>
    </div></div>`;
  },

  cierre(){
    app.innerHTML = `<div class="screen on"><div class="wrap hero center" style="padding-top:80px">
      <div style="font-size:3rem">🫀</div>
      <h1 style="margin:20px 0 16px">${esc(GAME.juego.agradecimiento)}</h1>
      <p class="lead" style="margin:0 auto 34px">${esc(GAME.juego.cierre)}</p>
      <button class="btn ghost" data-a="reiniciar">Volver a empezar ↻</button>
    </div></div>`;
  }
};

/* =========================================================================
   ORDENAR — barajado que nunca entrega el orden ya resuelto
   ========================================================================= */
function barajar(items){
  if(items.length<2) return items.slice();
  let a;
  for(let t=0;t<40;t++){
    a = items.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    if(!a.every((it,i)=>it.orden===i)) return a;
  }
  [a[0],a[1]]=[a[1],a[0]];
  return a;
}
function filasSort(arr){
  return arr.map((it,i)=>`<div class="srow">
    <div class="n">${i+1}</div><div class="tx">${esc(it.texto)}</div>
    <div class="arrows">
      <button data-up="${i}" ${i===0?'disabled':''} aria-label="Subir">▲</button>
      <button data-down="${i}" ${i===arr.length-1?'disabled':''} aria-label="Bajar">▼</button>
    </div></div>`).join('');
}

/* =========================================================================
   CIERRE DE ESTACIÓN
   ========================================================================= */
function cerrarEstacion(){
  const e = EST[S.est], qs = preguntasDe(e), R = S.respuestas[e.id]||{};
  const seg = Math.round(transcurrido());
  pararReloj();

  let puntosPreg = 0, aciertos = 0;
  const detalle = qs.map(q=>{
    const r  = R[q.codigo];
    const ok = evaluar(e,q,r);
    if(ok){ puntosPreg += q.puntos; aciertos++; }
    return { codigo:q.codigo, ok, puntos:ok?q.puntos:0, max:q.puntos, txt:textoRespuesta(e,q,r) };
  });

  const b = bonoActual(seg);
  const puntosTiempo = b ? b.puntos : 0;
  S.resultados[e.id] = { puntos:puntosPreg+puntosTiempo, puntosPreg, puntosTiempo,
                         seg, aciertos, detalle, rango:b?b.etiqueta:'Fuera de tiempo' };
  if(!S.resueltas.includes(S.est)) S.resueltas.push(S.est);
  ir('resultado');
}

/* =========================================================================
   OVERLAYS
   ========================================================================= */
const ov = document.getElementById('ov'), ovbox = document.getElementById('ovbox');
function cerrarOv(){ ov.classList.remove('on'); ov.removeAttribute('id-alarm'); ov.id='ov';
  document.getElementById('slash').classList.remove('on'); }

function alarma(){
  ov.id = 'alarm'; ov.classList.add('on');
  document.getElementById('slash').classList.add('on');
  ovbox.innerHTML = `<div style="font-size:2.2rem">⏱️</div>
    <h2>Se agotó el tiempo</h2>
    <p>La estación superó ${mmss(EST[S.est].tiempoMaxSeg)}. Pueden cerrarla igual:
       conservan los puntos de las respuestas, pero sin bonificación.</p>
    <div class="row"><button class="btn primary" data-a="cerrar">Cerrar estación</button></div>`;
}
function confirmarSalida(){
  ov.classList.add('on');
  ovbox.innerHTML = `<div style="font-size:2.2rem">⚠️</div>
    <h2>${esc(T.salirTitulo)}</h2><p>${esc(T.salirTexto)}</p>
    <div class="row">
      <button class="btn ghost" data-a="cerrar-ov">${esc(T.salirCancelar)}</button>
      <button class="btn danger" data-a="hub-forzado">${esc(T.salirConfirmar)}</button>
    </div>`;
}

/* =========================================================================
   EXPORTAR
   ========================================================================= */
function csv(){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const cab = ['Estacion','Aciertos','Total preguntas','Puntos respuestas','Bono tiempo','Duracion seg','Rango','Total'];
  const filas = EST.map(e=>{ const r=S.resultados[e.id]; return [
    e.nombre, r?r.aciertos:'', r?r.detalle.length:'', r?r.puntosPreg:'', r?r.puntosTiempo:'',
    r?r.seg:'', r?r.rango:'', r?r.puntos:''].map(q).join(';'); });
  const txt = '﻿'+[cab.map(q).join(';'),...filas].join('\r\n');
  const url = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'),{href:url,download:'la-hora-dorada-informe.csv'});
  a.click(); URL.revokeObjectURL(url);
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-a],[data-single],[data-multi],[data-tf],[data-up],[data-down]');
  if(!t) return;
  const e = EST[S.est], qs = preguntasDe(e), q = qs[S.q];
  const R = () => (S.respuestas[e.id] = S.respuestas[e.id] || {});

  /* --- ordenar --- */
  if(t.dataset.up!==undefined || t.dataset.down!==undefined){
    const arr = R()[q.codigo], i = +(t.dataset.up ?? t.dataset.down);
    const j = t.dataset.up!==undefined ? i-1 : i+1;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    document.getElementById('sort').innerHTML = filasSort(arr);
    return;
  }
  /* --- opción única --- */
  if(t.dataset.single!==undefined){
    R()[q.codigo] = +t.dataset.single;
    document.querySelectorAll('[data-single]').forEach((b,i)=>{
      b.classList.toggle('sel', i===+t.dataset.single);
      b.querySelector('.box').textContent = 'ABCD'[i]||i+1; });
    return;
  }
  /* --- opción múltiple --- */
  if(t.dataset.multi!==undefined){
    const i = +t.dataset.multi, cur = new Set(R()[q.codigo]||[]);
    cur.has(i) ? cur.delete(i) : cur.add(i);
    R()[q.codigo] = [...cur];
    t.classList.toggle('sel', cur.has(i));
    t.querySelector('.box').textContent = cur.has(i) ? '✓' : '';
    return;
  }
  /* --- verdadero / falso --- */
  if(t.dataset.tf!==undefined){
    R()[q.codigo] = t.dataset.tf==='true';
    document.querySelectorAll('[data-tf]').forEach(b=>{
      const on = b.dataset.tf===t.dataset.tf;
      b.classList.toggle('sel',on); b.querySelector('.box').textContent = on?'✓':''; });
    return;
  }

  switch(t.dataset.a){
    case 'intro':     ir('intro'); break;
    case 'hub':       pararReloj(); ir('hub'); break;
    case 'hub-forzado': cerrarOv(); pararReloj(); ir('hub'); break;
    case 'est':       S.est=+t.dataset.i; S.q=0; ir('briefing'); break;
    case 'empezar':   arrancarReloj(); ir('pregunta'); break;
    case 'antes':     S.q--; ir('pregunta'); break;
    case 'despues':   S.q++; ir('pregunta'); break;
    case 'revisar':   ir('revision'); break;
    case 'ir-q':      S.q=+t.dataset.i; ir('pregunta'); break;
    case 'cerrar':    cerrarOv(); cerrarEstacion(); break;
    case 'informe':   ir('informe'); break;
    case 'cierre':    ir('cierre'); break;
    case 'csv':       csv(); break;
    case 'salir':     confirmarSalida(); break;
    case 'cerrar-ov': cerrarOv(); break;
    case 'reiniciar': reset(); ir('cover'); break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarOv(); });

/* boot */
reset(); ir('cover');
document.getElementById('pie').textContent =
  'Prototipo v2 · ' + GAME.juego.titulo + ' — contenido pendiente de revisión clínica';
</script>
