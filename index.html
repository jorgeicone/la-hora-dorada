    if(f2) o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol||.16,c.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.03);
  }
  return {
    get activo(){ return on; },
    alternar(){
      on=!on;
      if(on){ const c=nuevo(); if(c.state==='suspended') c.resume(); this.ambiente(); }
      else if(amb){ amb.o.stop(); amb.o2.stop(); amb=null; }
      return on;
    },
    ambiente(){
      if(!on||amb) return; const c=nuevo();
      const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
      o.type='sine'; o.frequency.value=54; o2.type='sine'; o2.frequency.value=81;
      f.type='lowpass'; f.frequency.value=260; g.gain.value=.05;
      o.connect(f); o2.connect(f); f.connect(g).connect(c.destination); o.start(); o2.start();
      amb={o,o2,g};
    },
    pulso(){ tono(880,null,.09,'sine',.10); },
    clic(){  tono(420,null,.05,'square',.05); },
    acierto(){ tono(660,1320,.34,'sine',.20); },
    fallo(){ tono(300,90,.75,'sawtooth',.22); },
    abrir(){ tono(520,1560,.5,'triangle',.20); },
    tic(){   tono(1500,null,.04,'square',.07); }
  };
})();

const tipoDe = (e,q) => q.tipoReto || e.tipoReto;
const segDe  = (e,q) => q.tiempoPorPregunta !== undefined ? q.tiempoPorPregunta : e.tiempoPorPregunta;
const preguntaActual = () => {
  const e = EST[S.est];
  return S.q < e.preguntas.length ? e.preguntas[S.q] : e.candadoDespues;
};

function pPregunta(){
  const e = EST[S.est], q = preguntaActual(), t = tipoDe(e,q);
  locked = false;
  if(t === 'CODE') return pCandado(q);

  let cuerpo='';
  if(t === 'SORT'){
    work = q.items.slice();               // ya vienen barajados del servidor
    cuerpo = filasSort();
  } else if(t === 'MULTI'){
    work = new Set();
    cuerpo = q.opciones.map((o,i)=>
      `<button class="opt" data-multi="${i}"><span class="box"></span>${esc(o.texto)}</button>`).join('');
  } else if(t === 'TRUEFALSE'){
    work = null;
    cuerpo = `<div class="tf">
      <button class="opt" data-tf="true"><span class="box"></span>VERDADERO</button>
      <button class="opt" data-tf="false"><span class="box"></span>FALSO</button></div>`;
  } else {
    work = null;
    cuerpo = q.opciones.map((o,i)=>
      `<button class="opt" data-single="${i}"><span class="box">${'ABCD'[i]||i+1}</span>${esc(o.texto)}</button>`).join('');
  }
  const seg = segDe(e,q);
  pinta(`<div class="screen">${fondoDe(e.fondo)}
    <div class="layer">${barra({reloj:seg!=null, atras:true})}${vitales()}
      <div class="wrap"><div class="panel">
        <div class="qnum">${S.q+1}/${e.preguntas.length}</div>
        <p class="qtext">${esc(q.enunciado)}</p>
        <div id="cuerpo">${cuerpo}</div>
        <div class="qfoot"><button class="btn solid" id="enviar" data-a="enviar">${esc(T.enviar)}</button></div>
      </div></div></div></div>`);
  SFX.pulso();
  if(seg != null) arrancarReloj(seg);
}
function filasSort(){
  return work.map((it,i)=>`<div class="srow">
    <div class="idx">${i+1}</div><div class="body">${esc(it.texto)}</div>
    <div class="arrows">
      <button data-up="${i}" ${i===0?'disabled':''} aria-label="Subir">▲</button>
      <button data-down="${i}" ${i===work.length-1?'disabled':''} aria-label="Bajar">▼</button>
    </div></div>`).join('');
}
function arrancarReloj(seg){
  timeLeft = seg;
  const pintarReloj = ()=>{ const el=document.getElementById('timer'); if(!el) return;
    el.textContent = mmss(timeLeft);
    el.className = 'timer' + (timeLeft<=5?' crit' : timeLeft<=10?' warn' : ''); };
  pintarReloj();
  timerId = setInterval(()=>{
    timeLeft--; pintarReloj();
    if(timeLeft<=5 && timeLeft>0) SFX.tic();
    if(timeLeft<=0){ clearInterval(timerId); timerId=null; enviar(true); }
  },1000);
}

/* =========================================================================
   ENVÍO — la corrección la hace el servidor. Aquí no hay respuestas.
   ========================================================================= */
function cargaUtil(){
  const e = EST[S.est], t = tipoDe(e, preguntaActual());
  if(t === 'SORT')      return work.map(it=>it.id);
  if(t === 'MULTI')     return [...work];
  if(t === 'TRUEFALSE') return work;
  return work;                        // SINGLE: índice
}
async function enviar(porTiempo){
  if(locked) return; locked = true;
  if(timerId){ clearInterval(timerId); timerId=null; }
  const e = EST[S.est], q = preguntaActual();
  const b = document.getElementById('enviar');
  if(b){ b.disabled = true; b.textContent = T.enviado; }

  if(!porTiempo && work == null){ locked=false; if(b){b.disabled=false;b.textContent=T.enviar;} return; }

  let r;
  try {
    r = await rpc('evoforma2_responder', {
      p_partida: S.partida, p_estacion: e.id, p_codigo: q.codigo,
      p_respuesta: porTiempo ? null : cargaUtil(),
      p_seg_restantes: Math.max(0, timeLeft)
    });
  } catch(err){ locked=false; return pError(err.message); }

  S.puntos = r.puntos; S.aciertos = r.aciertos; S.intentos = r.intentos;
  S.hechas = r.estaciones_ok || [];
  marcar(r.correcta);

  if(r.correcta){
    SFX.acierto();
    const f = document.createElement('div'); f.className='flash'; stage.appendChild(f);
    setTimeout(()=> r.estacion_superada ? completarEstacion() : siguiente(), 1150);
  } else {
    setTimeout(fallar, 650);
  }
}
/* Solo se marca lo que el equipo eligió: el servidor no dice cuál era la buena,
   así REPETIR sigue exigiendo pensar. */
function marcar(ok){
  const e = EST[S.est], t = tipoDe(e, preguntaActual()), clase = ok?'ok':'bad';
  if(t === 'SORT'){ document.querySelectorAll('.srow').forEach(r=>r.classList.add(clase)); }
  else if(t === 'MULTI'){
    document.querySelectorAll('[data-multi]').forEach(b=>{ b.disabled=true;
      if(work.has(+b.dataset.multi)) b.classList.add(clase); });
  } else if(t === 'TRUEFALSE'){
    document.querySelectorAll('[data-tf]').forEach(b=>{ b.disabled=true;
      if((b.dataset.tf==='true')===work) b.classList.add(clase); });
  } else {
    document.querySelectorAll('[data-single]').forEach(b=>{ b.disabled=true;
      if(+b.dataset.single===work) b.classList.add(clase); });
  }
}
function fallar(){
  locked = true; SFX.fallo();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='alarm';
  ov.innerHTML = `<div class="mask"></div><div class="slash"></div>

      </div></div>`;
  stage.appendChild(ov);
}
function siguiente(){
  const e = EST[S.est];
  if(S.q < e.preguntas.length - 1 || (S.q === e.preguntas.length - 1 && e.candadoDespues)){
    S.q++; pPregunta();
  } else completarEstacion();
}

async function probarCodigo(){

/* ---------------- Eventos ---------------- */
stage.addEventListener('click', async ev=>{
  const t = ev.target.closest('[data-a],[data-single],[data-multi],[data-tf],[data-up],[data-down]');
  if(!t) return;

  if(t.dataset.up !== undefined || t.dataset.down !== undefined){
    const i=+(t.dataset.up ?? t.dataset.down), j = t.dataset.up!==undefined ? i-1 : i+1;
    [work[i],work[j]]=[work[j],work[i]];
    document.getElementById('cuerpo').innerHTML = filasSort(); SFX.clic(); return;
  }
  if(t.dataset.multi !== undefined){ if(locked) return;
    const i=+t.dataset.multi;
    if(work.has(i)){ work.delete(i); t.classList.remove('sel'); t.querySelector('.box').textContent=''; }
    else { work.add(i); t.classList.add('sel'); t.querySelector('.box').textContent='✓'; }
    SFX.clic(); return; }
  if(t.dataset.tf !== undefined){ if(locked) return; work = t.dataset.tf==='true';
    document.querySelectorAll('[data-tf]').forEach(b=>{b.classList.remove('sel');b.querySelector('.box').textContent='';});
    t.classList.add('sel'); t.querySelector('.box').textContent='✓'; SFX.clic(); return; }
  if(t.dataset.single !== undefined){ if(locked) return; work = +t.dataset.single;
    document.querySelectorAll('[data-single]').forEach((b,i)=>{ b.classList.toggle('sel', i===work);
      b.querySelector('.box').textContent='ABCD'[i]||i+1; });
    SFX.clic(); return; }

  switch(t.dataset.a){
    case 'registro':     pRegistro(); break;
    case 'entrar':       await entrar(); break;
    case 'mapa':         pMapa(); break;
    case 'estacion':     S.est=+t.dataset.i; S.q=0; pBriefing(); break;
    case 'empezar':      S.estT0=Date.now(); pPregunta(); break;
    case 'enviar':       await enviar(false); break;
    case 'reintentar':   pPregunta(); break;
    case 'probar':       await probarCodigo(); break;
    case 'trasEstacion': trasEstacion(); break;
    case 'informe':      await pInforme(); break;
    case 'gracias':      pGracias(); break;
    case 'salir':        confirmarSalida(); break;
    case 'cerrarOv':     document.getElementById('salida')?.remove(); break;
    case 'reiniciar':    reset(); pPortada(); break;
    case 'sonido':       SFX.alternar(); t.textContent = SFX.activo?'🔊':'🔇'; break;
  }
});
addEventListener('keydown', async e=>{
  const cod = document.getElementById('codigo');
  if(e.key==='Enter' && cod && document.activeElement===cod){ await probarCodigo(); return; }
  const eq = document.getElementById('equipo');
  if(e.key==='Enter' && eq && document.activeElement===eq){ await entrar(); return; }
  if(cod || eq) return;
  if(e.key.toLowerCase()==='f') document.documentElement.requestFullscreen?.().catch(()=>{});
  if(e.key.toLowerCase()==='r'){ reset(); pPortada(); }
});

async function entrar(){
  const nombre = document.getElementById('equipo').value.trim();
  const err = document.getElementById('regerr');
  if(!nombre){ err.textContent='Escriban el nombre del equipo.'; return; }
  pCargando('Registrando tripulación…');
  try{
    const r = await rpc('evoforma2_iniciar', { p_equipo:nombre,
      p_jornada: document.getElementById('jornada')?.value.trim() || null });
    S.partida=r.partida_id; S.equipo=r.equipo; S.puntos=r.puntos;
    S.aciertos=r.aciertos; S.intentos=r.intentos; S.hechas=r.estaciones_ok||[];
    S.hechas.length ? pMapa() : pIntro();
  } catch(x){ pError(x.message); }
}
